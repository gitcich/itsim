<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMM Lab Simulator</title>
<style>
:root{--bg:#0f1318;--panel:#171c23;--panel2:#1f2630;--line:#2b3440;--text:#dde4ec;--mute:#8b98a7;--acc:#2fb39a;--acc2:#1b7a68;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#243040}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:6px 11px}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc2);border-color:var(--acc)}button.dan{border-color:#6b2a2a;color:#ffb3ae}
button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;background:#0c1014;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
.logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#155a8a);display:grid;place-items:center;font-weight:700;font-size:11px}
.clock{font:12px ui-monospace,Consolas,monospace;background:#0c1014;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 52px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
nav button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;margin-bottom:2px;gap:8px;align-items:center;justify-content:space-between}
nav button.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
main{padding:16px;min-width:0;padding-bottom:240px}
.banner{font-size:12px;color:var(--mute);margin-bottom:12px}
h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:6px}h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sub{color:var(--mute);margin:0 0 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stat .n{font-size:26px;font-weight:600}.stat .l{color:var(--mute);font-size:12px;display:flex;gap:4px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px}.tw{overflow-x:auto}
tr.sel td{background:#14302b}tr.click{cursor:pointer}tr.click:hover td{background:#1a232c}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--chip);white-space:nowrap}
.pill.ok{background:#173d22;color:#7ee28f}.pill.bad{background:#4a1c1c;color:#ffa198}.pill.warn{background:#3d3012;color:#f0c86a}.pill.acc{background:#123a34;color:#7fe0cc}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:7px;background:#0c1014;border-radius:4px;overflow:hidden;margin-top:3px;min-width:60px}.bar i{display:block;height:100%;background:var(--acc)}.bar i.hot{background:var(--warn)}.bar i.crit{background:var(--bad)}
.tip-ic{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:10px;font-weight:700;cursor:help;flex:none;user-select:none}
.tip-ic:hover{border-color:var(--acc);color:var(--acc)}[data-tip]{cursor:help}
#tip{position:fixed;z-index:100;max-width:360px;background:#0a0e12;border:1px solid var(--acc);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px #000a;display:none;font-size:13px}
#tip h4{margin:0 0 6px;font-size:14px;color:var(--acc)}#tip .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-top:8px}#tip p{margin:2px 0}
#log{position:fixed;right:12px;bottom:12px;width:400px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:30;box-shadow:0 8px 24px #0008}
#log .hd{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mute)}
#log .bd{max-height:170px;overflow:auto;padding:6px 10px;font:12px/1.5 ui-monospace,Consolas,monospace}#log.min .bd{display:none}
.lg-ok{color:#7ee28f}.lg-bad{color:#ffa198}.lg-warn{color:#f0c86a}.lg-info{color:#9fb3c8}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px}
.modal.wide{width:min(760px,100%)}
.field{margin-bottom:11px}.field label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{display:flex;gap:5px;align-items:center;background:var(--panel2);padding:4px 8px;border-radius:6px;color:var(--text);font-size:12px}.checks input{width:auto}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ctl:last-child{border-bottom:0}
.ctl .nm{font-weight:500;display:flex;gap:6px;align-items:center}.ctl .ds{font-size:12px;color:var(--mute)}
.sw{position:relative;width:40px;height:22px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2b3440;border-radius:22px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#cfd8e2;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(18px)}
.obj{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.obj .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.obj.done .ck{background:var(--ok);border-color:var(--ok);color:#06210c}.obj .hint{font-size:12px;color:var(--mute)}
.scbar{background:#11262a;border:1px solid var(--acc2);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.empty{color:var(--mute);font-style:italic;padding:8px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:0;border-radius:6px 6px 0 0;background:transparent;padding:6px 10px}.tabs button.on{background:var(--panel2);box-shadow:inset 0 -2px 0 var(--acc)}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.tk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px;cursor:pointer}.tk:hover{border-color:var(--acc)}
.tk.breach{border-color:var(--bad)}
.term{background:#05080a;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Consolas,monospace;min-height:120px;max-height:220px;overflow:auto;color:#a8f0c6;white-space:pre-wrap}
.tree .org{margin-bottom:10px}.tree .loc{margin-left:16px;font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}.dot.off{background:#56606b}.dot.alert{background:var(--bad)}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
 nav button{width:auto;white-space:nowrap;margin:0 2px}nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}main{padding:12px;padding-bottom:90px}#log{width:auto;left:12px}}
#aiBtn{position:fixed;left:212px;bottom:12px;z-index:31;background:linear-gradient(135deg,var(--acc),#155a8a);border:0;color:#fff;border-radius:22px;padding:9px 15px;font-weight:600;box-shadow:0 6px 18px #0008}
#aiPanel{position:fixed;left:212px;bottom:60px;width:400px;max-width:calc(100vw - 24px);height:min(560px,calc(100vh - 130px));z-index:40;background:var(--panel);border:1px solid var(--acc2);border-radius:12px;box-shadow:0 12px 30px #000a;display:none;flex-direction:column}
#aiPanel.open{display:flex}
#aiPanel .ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#aiPanel .ah b{flex:1}
#aiMsgs{flex:1;overflow:auto;padding:10px 12px;font-size:13px}
.am{margin-bottom:10px;padding:8px 10px;border-radius:10px;max-width:92%;word-wrap:break-word}
.am.u{background:#123a34;margin-left:auto}
.am.a{background:var(--panel2)}
.am.a ul{margin:4px 0;padding-left:18px}
.am code{background:#0c1014;padding:0 4px;border-radius:4px;font-size:12px}
.am.err{background:#3a1717;color:#ffb3ae}
.am .tool{font-size:11px;color:var(--mute);margin-top:4px}
#aiSugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
#aiSugg button{font-size:12px;padding:4px 9px;border-radius:14px}
#aiForm{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
#aiForm textarea{resize:none;height:40px}
@media (max-width:760px){#aiBtn{left:auto;right:12px;bottom:58px}#aiPanel{left:8px;right:8px;width:auto;bottom:8px;height:78vh;max-width:none}}
</style>
</head>
<body>
<header>
 <div class="row"><div class="logo">RMM</div><h1>RMM Lab Simulator</h1><span class="tip-ic" data-tip="rmm">?</span></div>
 <span class="clock" id="clock" data-tip="clock"></span>
 <button data-act="tick" data-v="1" data-tip="clock">+1 hour ▶</button>
 <button data-act="tick" data-v="24">+1 day ▶▶</button>
 <div class="spacer"></div>
 <button data-act="sample">Load sample MSP</button>
 <button class="dan" data-act="reset">Reset</button>
</header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<div id="log"><div class="hd" data-act="logtoggle"><span>Activities</span><span id="logcount"></span></div><div class="bd" id="logbd"></div></div>
<div id="tip"></div><div id="modalRoot"></div>
<button id="aiBtn" type="button" data-tip="assistant">✦ Ask AI</button>
<div id="aiPanel" role="dialog" aria-label="AI assistant">
 <div class="ah"><span class="logo" style="width:22px;height:22px">AI</span><b>Lab Assistant</b><span class="tip-ic" data-tip="assistant">?</span><button class="sm" type="button" id="aiClear">New chat</button><button class="sm" type="button" id="aiClose">✕</button></div>
 <div id="aiMsgs"></div>
 <div id="aiSugg"></div>
 <form id="aiForm"><textarea id="aiIn" placeholder="Ask about RMM, your lab, or your scenario…"></textarea><button class="pri" type="submit" id="aiSend">Send</button></form>
</div>

<script>
/* ===================== GLOSSARY ===================== */
const G={
rmm:{t:"RMM Lab Simulator",d:"An independent practice console modeled on the workflows of NinjaOne, a remote monitoring & management (RMM) and endpoint management platform used by MSPs and IT departments. Not affiliated with or endorsed by NinjaOne.",h:"Load the sample MSP, then advance the clock to let monitoring, patching, automations and backups run. Try a scenario for guided practice.",a:"Other RMM/endpoint platforms: ConnectWise Automate & RMM, Datto RMM (Kaseya), N-able N-central / N-sight, Kaseya VSA, Atera, Syncro, Action1, Microsoft Intune (endpoint management)."},
clock:{t:"Simulation clock",d:"Time only moves when you advance it. Each hour the agents report in: metrics drift, conditions are evaluated, scheduled automations run, and patch/backup schedules fire at their set hours.",h:"Use +1 hour for fine-grained testing, +1 day to run a full patch/backup cycle.",a:"In the real product, agents check in continuously and schedules run on real time."},
org:{t:"Organization",d:"A client (for an MSP) or business unit. Top level of the hierarchy: Organization → Location → Device. Each organization maps device roles to agent policies.",h:"Organizations → Add organization. Choose a policy for each device role, add locations, then deploy agents.",a:"Called 'Clients' in Datto RMM, 'Customers' in N-able, 'Companies' in ConnectWise."},
location:{t:"Location",d:"A site within an organization (office, branch, remote workers). Used for filtering, reporting, installers and location-specific settings.",h:"Add one per physical site, plus one like 'Remote' for work-from-home devices.",a:"Sites (Datto, N-able), Locations (ConnectWise)."},
installer:{t:"Agent installer",d:"An installer generated for a specific organization + location. Devices that run it check in already placed in the right org, location and policy.",h:"Organizations → Deploy agents. In real life you'd push the MSI by GPO, Intune, or a deployment tool, or send a link for users to run.",a:"Every RMM uses per-site installers or registration tokens."},
agent:{t:"Agent",d:"Lightweight software on each device that reports health, runs scripts, applies patches and enables remote access.",h:"If a device stops checking in, it shows offline and offline conditions can alert.",a:"Agentless monitoring via SNMP / WMI is used for network gear and printers."},
device:{t:"Device",d:"A managed endpoint: workstation, server, Mac or Linux machine. The device page shows health, patches, software, alerts and actions.",h:"Devices → click a row to open its details and actions.",a:"Network devices (switches, firewalls) are monitored via SNMP in the NMS module."},
role:{t:"Device role",d:"The device class (Windows Workstation, Windows Server, macOS, Linux Server). The organization's policy mapping uses the role to pick which agent policy applies.",h:"Set when the agent is deployed; a device-level policy override can replace it.",a:"Device groups / dynamic groups in other RMMs."},
policy:{t:"Agent policy",d:"The central configuration for a device role: monitoring conditions, scheduled automations, patching, software, antivirus and backup. Configure once, apply to every device mapped to it.",h:"Policies page → open a policy → use its tabs. Keep a small number of well-named policies.",a:"Monitoring templates (N-able), Policies (Datto), Intune configuration & compliance policies."},
inherit:{t:"Policy inheritance",d:"A child policy inherits everything from its parent and adds or overrides settings. Change the parent once and every child gets it.",h:"Create a child for a client with special needs instead of copying a whole policy. In this sim, child conditions and automations are added to the parent's; patch/software/AV/backup settings inherit unless the child sets its own.",a:"Template hierarchies exist in most RMMs."},
cond:{t:"Condition",d:"A monitoring rule: when a metric crosses a threshold (disk, CPU, offline, service stopped, pending reboot, AV, backup), it raises an alert and can trigger actions.",h:"Policy → Conditions → Add. Pick a severity and actions: create ticket, notify, and/or run an automation to self-heal.",a:"Monitors / thresholds in other RMMs; Azure Monitor alert rules."},
compound:{t:"Compound condition",d:"A condition that only fires when several things are true together (e.g., disk is high AND a reboot is pending), reducing noisy alerts.",h:"Pick 'Compound: disk high AND pending reboot' as the condition type.",a:"Multi-criteria monitors / correlation rules."},
sev:{t:"Severity",d:"How serious an alert is: Critical, Major, Moderate, Minor. Drives notification routing and ticket priority.",h:"Reserve Critical for outages and data risk (server offline, backup failed).",a:"P1–P4 priorities in PSA tools."},
remed:{t:"Automated remediation",d:"An automation that runs when a condition fires to fix the problem (e.g., clear temp files on low disk). If the fix works, the alert resets on its own.",h:"In the condition, choose an automation under 'Run automation'. Add 'Create ticket' too so there's a record.",a:"Self-healing in Datto/N-able, Intune remediations (proactive remediations)."},
auto:{t:"Scheduled automation",d:"An Automation Library item run on a schedule by a policy (maintenance tasks, inventory, cleanup).",h:"Policy → Scheduled automations → Add. Choose the script and Hourly or Daily 03:00.",a:"Scheduled tasks in Datto/N-able, Intune platform scripts, Ansible schedules."},
lib:{t:"Automation Library",d:"Your reusable scripts (PowerShell, Batch, ShellScript, Python) and built-in actions, run on demand, by conditions or on schedules.",h:"Automation Library → Add script. Name it clearly, set the language and categories, and test on one device first.",a:"Community script shares (NinjaOne Dojo, Datto ComStore), GitHub repos, Intune scripts."},
patch:{t:"OS patch management",d:"The policy scans for missing OS updates, auto-approves or rejects them by severity, installs approved ones in the maintenance window and handles reboots.",h:"Policy → Patching: enable, set scan and install hours, approval per severity, and reboot behavior.",a:"Microsoft Intune / Windows Autopatch, Azure Update Manager, Action1, ManageEngine Patch Manager, WSUS (deprecated)."},
ptues:{t:"Patch Tuesday",d:"Microsoft's monthly security release, the second Tuesday of each month. Usually brings a cumulative update plus other fixes.",h:"Click 'Release Patch Tuesday' on the Patching page to simulate the release, then scan, approve and install.",a:"Third-party vendors release on their own cadence; browsers update almost weekly."},
approve:{t:"Patch approval",d:"Rules that decide what happens to a scanned patch: Approve (install automatically), Reject (never install) or Manual (a tech decides).",h:"Common baseline: Critical + Important = Approve, Moderate = Manual, Low/driver = Manual or Reject.",a:"Approval rings: pilot devices get patches days before the rest."},
ai:{t:"Patch Intelligence AI",d:"NinjaOne's feature that analyzes telemetry and vendor feedback to flag Windows updates that look unstable. Admins can then approve or reject the flagged patch.",h:"Turn on 'Hold AI-flagged patches' in the policy. Flagged patches are held even if their severity is auto-approved.",a:"Patch rings with a pilot group, community intelligence feeds (e.g., PatchManagement.org), vendor known-issue pages."},
window:{t:"Maintenance window",d:"The hours when installs and reboots are allowed, so users aren't interrupted.",h:"Set the scan hour and install hour in the policy (e.g., scan 01:00, install 02:00).",a:"Intune update rings with active hours; Windows Autopatch deployment rings."},
reboot:{t:"Reboot management",d:"Many patches need a restart. Options: reboot automatically in the window, prompt the user, or never (leave a pending reboot).",h:"Servers often use 'Never' with a separate controlled reboot; workstations use 'Prompt user' or automatic overnight.",a:"Cluster-aware updating for clustered servers."},
tpp:{t:"Third-party software patching",d:"Keeps common apps (Chrome, Firefox, Zoom, Adobe Reader, 7-Zip) updated automatically — a major source of vulnerabilities if ignored.",h:"Policy → Software → choose apps under 'Third-party patching'.",a:"Patch My PC, Action1, Chocolatey/Winget scripts, ManageEngine."},
swdeploy:{t:"Software deployment",d:"Install standard applications automatically on every device in a policy.",h:"Policy → Software → choose apps under 'Install'. They install on the next check-in.",a:"Intune app deployment, Winget/Chocolatey scripts, PDQ Deploy."},
av:{t:"Antivirus / EDR",d:"Endpoint protection deployed and monitored through the policy. The RMM shows status and threats on each device.",h:"Policy → Security → enable. Add an 'Antivirus not running' condition to catch broken agents.",a:"Microsoft Defender for Endpoint, Bitdefender GravityZone, SentinelOne, CrowdStrike, Huntress."},
backup:{t:"Backup",d:"Policy-driven backups: Image (whole machine) or File & Folder, to Cloud, Local or Hybrid (both) storage.",h:"Policy → Backup: enable, choose type, destination and hour. Add a 'Backup failed' condition.",a:"Datto BCDR, Veeam, Acronis Cyber Protect, Axcient, N-able Cove."},
restore:{t:"Restore test",d:"Proving a backup can actually be restored. Backups that have never been tested aren't proven to work.",h:"Backup page → Test restore on a device with a successful backup.",a:"Automated screenshot verification (Datto, Veeam SureBackup)."},
remote:{t:"Remote access",d:"Take control of or work on a device remotely. Background tools (services, terminal, files, processes) let you fix things without interrupting the user.",h:"Device → Remote session. Use Services to restart a stopped service, Terminal for commands, then log a ticket note.",a:"ConnectWise ScreenConnect, Splashtop, TeamViewer, Microsoft Remote Help, RDP over VPN."},
alert:{t:"Alerts",d:"Raised by conditions. Active until the condition clears (auto-reset) or a tech resets it.",h:"Alerts page: review, create a ticket, or reset. Fix the root cause, not just the alert.",a:"Alert dashboards in every RMM; PagerDuty/Opsgenie for on-call routing."},
ticket:{t:"Ticketing",d:"Built-in help desk: tickets from alerts, email or manual entry, with status, priority, assignee, time and notes.",h:"Ticketing page: assign, move through statuses, add notes, resolve. Watch the SLA timer.",a:"PSA tools: ConnectWise PSA, Autotask (Datto), HaloPSA, Freshservice, ServiceNow; many RMMs integrate with these."},
sla:{t:"SLA",d:"Service Level Agreement: the promised time to resolve by priority. Here P1 = 4h, P2 = 8h, P3 = 24h, P4 = 72h (simulated clock).",h:"Tickets past their SLA are outlined in red. Work P1s first.",a:"SLA timers are a core PSA feature (response vs. resolution targets)."},
docs:{t:"IT documentation",d:"Per-organization knowledge: credentials (vaulted), apps & services, network info and knowledge base articles — next to the devices they describe.",h:"Organizations → Documentation. Never store passwords in tickets or notes.",a:"IT Glue, Hudu, Passportal, Keeper, Confluence."},
cred:{t:"Credential vault",d:"Encrypted storage for passwords with access control and audit logging.",h:"Add credentials as type 'Credential'; they show masked until revealed.",a:"IT Glue / Passportal, Keeper, 1Password Business, Bitwarden."},
disk:{t:"Disk usage",d:"Percent of the system drive used. Above ~90%, Windows updates fail and apps slow down.",h:"Monitor with a disk condition; remediate with a cleanup script.",a:"Storage Sense (Windows), cleanup scripts."},
svc:{t:"Windows services",d:"Background programs (Print Spooler, Windows Update, etc.). A stopped service is a classic help-desk ticket.",h:"Use a service condition to alert, and a restart script or remote session to fix.",a:"Service monitors in every RMM."},
compliance:{t:"Patch compliance",d:"Share of Windows devices with no outstanding Critical or Important patches. Held, rejected and manually deferred patches don't count against it.",h:"Patching page shows compliance per organization.",a:"Compliance reporting in Intune / Autopatch reports."},
scn:{t:"Practice scenarios",d:"Guided exercises based on everyday MSP and help-desk work. Each one loads the sample MSP and checks your objectives live.",h:"Start one; the checklist appears at the top of every page.",a:"Vendor academies (NinjaOne Dojo & training, Datto/Kaseya University, N-able training) and free trials."},
assistant:{t:"AI Lab Assistant",d:"A built-in AI tutor available on every page. It can explain concepts, tell you where to click, look up your lab's devices, policies, alerts and tickets, and coach you through scenarios with hints.",h:"Tap ✦ Ask AI (bottom of the screen), pick a suggestion or type a question. Use 'Get a hint' on a running scenario or 'Ask AI' on a device. It can open pages for you but never changes settings — you do the clicking.",a:"Most major RMM and PSA vendors (NinjaOne, ConnectWise, Kaseya/Datto, N-able) and Microsoft (Security Copilot, Copilot in Intune) now ship AI assistants for technicians."},
health:{t:"Health overview",d:"Fleet-wide status: devices online, active alerts, open tickets, patch compliance, AV and backup coverage.",h:"Start your day here; drill into whatever is red.",a:"Custom dashboards and scheduled reports."}
};

/* ===================== CONSTANTS ===================== */
const ROLES=["Windows Workstation","Windows Server","macOS","Linux Server"];
const SEVS=["Critical","Major","Moderate","Minor"];
const PSEV=["Critical","Important","Moderate","Low"];
const APPS=["Google Chrome","Mozilla Firefox","7-Zip","Zoom Workplace","Adobe Acrobat Reader","Microsoft 365 Apps","Microsoft Teams"];
const TECHS=["Unassigned","Alex (Tier 1)","Sam (Tier 2)","Jordan (Lead)"];
const SLA={P1:4,P2:8,P3:24,P4:72};
const CONDS={disk:"Disk usage above %",cpu:"CPU above %",offline:"Device offline",svc:"Print Spooler service stopped",reboot:"Pending reboot",avoff:"Antivirus not running",bkfail:"Backup failed / overdue",compound:"Compound: disk above % AND pending reboot"};
const EFFECTS={cleanDisk:"Frees ~15% disk",restartSvc:"Restarts Print Spooler",reboot:"Reboots device",flushDns:"Flushes DNS cache",inventory:"Collects inventory",startAV:"Starts antivirus service",none:"No simulated effect"};

/* ===================== STATE ===================== */
function fresh(){return{clock:0,seed:7,orgs:[],locs:[],devices:[],policies:[],scripts:builtinScripts(),alerts:[],tickets:[],docs:[],flags:{},log:[],seq:1,tab:"dash",sel:null,ptab:"cond",polSel:null,scenario:null,tnum:1001}}
function builtinScripts(){return[
 {id:"x1",name:"Clean temp files & recycle bin",lang:"PowerShell",cat:"Maintenance",effect:"cleanDisk",builtIn:true},
 {id:"x2",name:"Restart Print Spooler",lang:"PowerShell",cat:"Remediation",effect:"restartSvc",builtIn:true},
 {id:"x3",name:"Reboot device",lang:"Built-in action",cat:"Maintenance",effect:"reboot",builtIn:true},
 {id:"x4",name:"Flush DNS cache",lang:"Batch",cat:"Network",effect:"flushDns",builtIn:true},
 {id:"x5",name:"Collect hardware inventory",lang:"PowerShell",cat:"Inventory",effect:"inventory",builtIn:true},
 {id:"x6",name:"Start Defender service",lang:"PowerShell",cat:"Security",effect:"startAV",builtIn:true}]}
let S=load()||fresh();
function save(){try{localStorage.setItem("rmmlab-v1",JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem("rmmlab-v1");return r?Object.assign(fresh(),JSON.parse(r)):null}catch(e){return null}}
const uid=p=>p+(S.seq++);
const byId=(a,id)=>a.find(x=>x.id===id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tip=k=>`<span class="tip-ic" data-tip="${k}">?</span>`;
function rnd(){S.seed=(S.seed*1103515245+12345)%2147483648;return S.seed/2147483648}
function clockStr(h=S.clock){const d=Math.floor(h/24)+1,hh=h%24;return`Day ${d} · ${String(hh).padStart(2,"0")}:00`}
function log(msg,lvl="info"){S.log.unshift({t:clockStr(),msg,lvl});S.log=S.log.slice(0,250)}

/* ===================== POLICY RESOLUTION ===================== */
function polChain(id){const out=[];let p=byId(S.policies,id),g=0;while(p&&g<10){out.unshift(p);p=byId(S.policies,p.parentId);g++}return out}
function eff(id){const ch=polChain(id);const e={conds:[],autos:[],patch:null,sw:null,av:null,backup:null,name:ch.length?ch[ch.length-1].name:"(none)"};
 ch.forEach(p=>{e.conds=e.conds.concat(p.conds);e.autos=e.autos.concat(p.autos);["patch","sw","av","backup"].forEach(k=>{if(p[k]!==null&&p[k]!==undefined)e[k]=p[k]})});
 if(!e.patch)e.patch={enabled:false};if(!e.sw)e.sw={install:[],tpp:[]};if(e.av===null)e.av=false;if(!e.backup)e.backup={enabled:false};return e}
function devPolicyId(d){if(d.override)return d.override;const o=byId(S.orgs,d.orgId);return o&&o.map[d.role]}
function devEff(d){return eff(devPolicyId(d))}
function newPolicy(name,role,parentId=null){return{id:uid("p"),name,role,parentId,conds:[],autos:[],
 patch:parentId?null:{enabled:false,scanHour:1,applyHour:2,rules:{Critical:"Approve",Important:"Approve",Moderate:"Manual",Low:"Manual"},ai:false,reboot:"Prompt user"},
 sw:parentId?null:{install:[],tpp:[]},av:parentId?null:false,backup:parentId?null:{enabled:false,type:"Image",dest:"Cloud",hour:22}}}

/* ===================== SIM ENGINE ===================== */
function condTrue(c,d){switch(c.kind){
 case"disk":return d.online&&d.disk>=c.th;case"cpu":return d.online&&d.cpu>=c.th;case"offline":return!d.online;
 case"svc":return d.online&&d.role.startsWith("Windows")&&d.spooler==="stopped";case"reboot":return d.online&&d.pendingReboot;
 case"avoff":return d.online&&devEff(d).av&&d.av!=="running";case"bkfail":return devEff(d).backup.enabled&&d.backup.status==="failed";
 case"compound":return d.online&&d.disk>=c.th&&d.pendingReboot}return false}
function condLabel(c){return CONDS[c.kind].replace("%",c.th!=null?c.th+"%":"")}
function runScript(sid,d,why){const s=byId(S.scripts,sid);if(!s)return;if(!d.online){log(`${s.name} queued — ${d.name} is offline`,"warn");return}
 switch(s.effect){case"cleanDisk":{const b=d.disk;d.disk=Math.max(35,d.disk-15);log(`${s.name} on ${d.name}: disk ${b}% → ${d.disk}%${why?" ("+why+")":""}`,"ok");break}
 case"restartSvc":if(d.spooler==="stopped"){d.spooler="running";log(`${s.name} on ${d.name}: service started${why?" ("+why+")":""}`,"ok")}else log(`${s.name} on ${d.name}: service already running`);break;
 case"reboot":d.pendingReboot=false;d.cpu=12;if(d.spooler==="stopped")d.spooler="running";log(`${d.name} rebooted${why?" ("+why+")":""}`,"ok");break;
 case"startAV":if(devEff(d).av){d.av="running";log(`${s.name} on ${d.name}: AV running`,"ok")}else log(`${d.name}: no AV deployed by policy`,"warn");break;
 default:log(`${s.name} completed on ${d.name}${why?" ("+why+")":""}`,"ok")}}
function evaluate(fromTick){
 for(const d of S.devices){const e=devEff(d);
  for(const c of e.conds){const key=d.id+"|"+c.id;let a=S.alerts.find(x=>x.key===key&&x.status==="active");const on=condTrue(c,d);
   if(on&&!a){a={id:uid("a"),key,devId:d.id,condId:c.id,sev:c.sev,msg:condLabel(c),status:"active",time:S.clock,ticketId:null};S.alerts.push(a);
    log(`ALERT [${c.sev}] ${d.name}: ${a.msg}`,c.sev==="Critical"||c.sev==="Major"?"bad":"warn");
    if(c.ticket){const t=mkTicket(`${d.name}: ${a.msg}`,d.orgId,d.id,c.sev==="Critical"?"P1":c.sev==="Major"?"P2":c.sev==="Moderate"?"P3":"P4","Alert");a.ticketId=t.id}
    if(c.notify)log(`Notification sent to on-call technician for ${d.name}`);
    if(c.script){runScript(c.script,d,"auto-remediation");if(!condTrue(c,d)){a.status="reset";a.auto=true;S.flags.autoRemed=true;log(`Alert auto-reset on ${d.name}: remediation succeeded`,"ok");
     if(a.ticketId){const t=byId(S.tickets,a.ticketId);t.status="Resolved";t.notes.push({t:clockStr(),by:"Automation",txt:"Auto-remediated by condition action."});t.resolvedAt=S.clock}}}}
   else if(!on&&a){a.status="reset";log(`Alert cleared: ${d.name} — ${a.msg}`,"ok")}}}
 S.alerts=S.alerts.filter(a=>a.status==="active"||S.clock-a.time<72).slice(-300)}
function mkTicket(title,orgId,devId,pri,src){const t={id:uid("t"),num:S.tnum++,title,orgId,devId,pri,status:"Open",assignee:"Unassigned",created:S.clock,notes:[],source:src};S.tickets.push(t);log(`Ticket #${t.num} created (${pri}): ${title}`);return t}
function hourTick(){S.clock++;const h=S.clock%24;
 for(const d of S.devices){const e=devEff(d);
  if(d.online){if(rnd()<.12)d.disk=Math.min(99,d.disk+1+Math.floor(rnd()*3));d.cpu=rnd()<.03?96:Math.round(8+rnd()*45);
   if(d.role==="Windows Workstation"&&d.spooler==="running"&&rnd()<.006)d.spooler="stopped";
   if(d.role!=="Windows Server"&&d.role!=="Linux Server"&&rnd()<.004){d.online=false;d.offSince=S.clock}}
  else if(!d.pinnedOff&&rnd()<.25)d.online=true;
  if(!d.online)continue;
  // software & AV
  e.sw.install.forEach(a=>{if(!d.apps.includes(a)){d.apps.push(a);log(`Installed ${a} on ${d.name} (policy)`,"ok")}});
  e.sw.tpp.forEach(a=>{if(d.outdated.includes(a)){d.outdated=d.outdated.filter(x=>x!==a);log(`Updated ${a} on ${d.name} (third-party patching)`,"ok")}});
  if(e.av&&d.av==="none"){d.av="running";log(`Antivirus deployed to ${d.name}`,"ok")}
  // scheduled automations
  e.autos.forEach(a=>{if(a.sched==="Hourly"||(a.sched==="Daily 03:00"&&h===3))runScript(a.script,d,"scheduled")});
  // patching
  if(e.patch.enabled&&d.role.startsWith("Windows")){if(h===e.patch.scanHour)scanDev(d,e);if(h===e.patch.applyHour)applyDev(d,e)}
  // backup
  if(e.backup.enabled&&h===e.backup.hour){d.backup={status:"success",last:S.clock,type:e.backup.type,dest:e.backup.dest};log(`Backup (${e.backup.type} → ${e.backup.dest}) succeeded on ${d.name}`,"ok")}}
 for(const d of S.devices){const e=devEff(d);if(e.backup.enabled&&!d.online&&h===e.backup.hour){d.backup={...d.backup,status:"failed"};log(`Backup FAILED on ${d.name}: device offline`,"bad")}}
 evaluate(true)}
function scanDev(d,e){let n=0;d.patches.forEach(p=>{if(p.state==="new"){n++;if(p.flagged&&e.patch.ai)p.state="held";else{const r=e.patch.rules[p.sev];p.state=r==="Approve"?"approved":r==="Reject"?"rejected":"available"}}});
 if(n)log(`Patch scan on ${d.name}: ${n} new patch(es) evaluated`)}
function applyDev(d,e){const ap=d.patches.filter(p=>p.state==="approved");if(!ap.length)return;ap.forEach(p=>{p.state="installed";if(p.flagged){S.flags.flaggedInstalled=true}});
 if(ap.some(p=>p.flagged)&&rnd()<.9)log(`${d.name}: installed AI-flagged ${ap.find(p=>p.flagged).kb} — users report app crashes after update`,"bad");
 const rb=(e.patch.reboot||"Prompt user");if(rb==="Automatic"){d.pendingReboot=false;log(`${d.name}: ${ap.length} patch(es) installed, rebooted in maintenance window`,"ok")}else{d.pendingReboot=true;log(`${d.name}: ${ap.length} patch(es) installed, reboot pending (${rb})`,"ok")}}
function compliant(d){return!d.patches.some(p=>["new","available","approved"].includes(p.state)&&(p.sev==="Critical"||p.sev==="Important"))}
function compliancePct(list){const w=list.filter(d=>d.role.startsWith("Windows"));return w.length?Math.round(w.filter(compliant).length/w.length*100):100}

 patches:[],apps:role.startsWith("Windows")?["Microsoft 365 Apps"]:[],outdated:role==="Windows Workstation"?["Google Chrome"]:[],av:"none",backup:{status:"none",last:null},override:null,

 /* patching */
 ptues(){if(!S.devices.some(d=>d.role.startsWith("Windows")))return toast("No Windows devices.");const m=S.flags.ptuesN=(S.flags.ptuesN||0)+1;const base=5050000+m*10;
  S.devices.filter(d=>d.role.startsWith("Windows")).forEach(d=>{const srv=d.role==="Windows Server";
   d.patches.push({id:uid("k"),kb:"KB"+(base+1),title:`${srv?"Server 2022":"Windows 11"} Cumulative Update`,sev:"Critical",state:"new"},{id:uid("k"),kb:"KB"+(base+2),title:".NET Framework Security Update",sev:"Important",state:"new"},
    {id:uid("k"),kb:"KB"+(base+3),title:"Defender platform update",sev:"Moderate",state:"new"},{id:uid("k"),kb:"KB"+(base+4),title:"Intel display driver",sev:"Low",state:"new"});
   if(!srv)d.patches.push({id:uid("k"),kb:"KB"+(base+5),title:"Cumulative Update Preview (optional)",sev:"Important",state:"new",flagged:true})});
  S.flags.ptues=true;log(`Patch Tuesday released: 4–5 updates per Windows device. AI flags KB${base+5} as unstable.`,"warn")},

function vPols(){const p=byId(S.policies,S.polSel);return`<h2>Policies ${tip("policy")}</h2><p class="sub">Agent policies drive monitoring, automation, patching, software, security and backup.</p>

function polEditor(p){const t=S.ptab,e=eff(p.id),par=byId(S.policies,p.parentId);const tabs=[["cond","Conditions"],["auto","Scheduled automations"],["patch","Patching"],["sw","Software"],["sec","Security"],["bk","Backup"]];

 if(t==="auto")body=`${p.autos.map(a=>`<div class="ctl"><div><div class="nm">${esc((byId(S.scripts,a.script)||{}).name)}</div><div class="ds">${a.sched}</div></div><button class="sm" data-act="delAuto" data-v="${p.id}" data-k="${a.id}">✕</button></div>`).join("")||'<div class="empty">None.</div>'}<button class="sm pri" style="margin-top:8px" data-act="addAuto" data-v="${p.id}">+ Add scheduled automation</button> ${tip("auto")}`;
 if(t==="patch"){body=inh("patch");if(own("patch")){const pt=p.patch;body+=`<div class="ctl"><div><div class="nm">OS patching ${tip("patch")}</div><div class="ds">Windows devices only in this sim</div></div><label class="sw"><input type="checkbox" ${pt.enabled?"checked":""} data-act="patchOn" data-v="${p.id}"><span></span></label></div>
  <div class="ctl"><div><div class="nm">Hold AI-flagged patches ${tip("ai")}</div><div class="ds">Patch Intelligence AI flags unstable updates</div></div><label class="sw"><input type="checkbox" ${pt.ai?"checked":""} data-act="patchAI" data-v="${p.id}"><span></span></label></div>
  <table style="margin:8px 0"><tr><td>Scan / install ${tip("window")}</td><td>${String(pt.scanHour).padStart(2,"0")}:00 / ${String(pt.applyHour).padStart(2,"0")}:00</td></tr>${PSEV.map(s=>`<tr><td>${s} ${s==="Critical"?tip("approve"):""}</td><td>${pt.rules[s]}</td></tr>`).join("")}<tr><td>Reboot ${tip("reboot")}</td><td>${pt.reboot}</td></tr></table><button class="sm pri" data-act="patchEdit" data-v="${p.id}">Edit patch settings</button>`}
  else body+=`<p class="ds" style="font-size:12px">Effective: ${e.patch.enabled?"enabled":"disabled"}, AI hold ${e.patch.ai?"on":"off"}</p>`}
 if(t==="sw"){body=inh("sw");const sw=own("sw")?p.sw:e.sw;body+=`<p><b style="font-size:12px;color:var(--mute)">Install ${tip("swdeploy")}</b><br>${sw.install.map(a=>`<span class="pill ok" style="margin:2px">${esc(a)}</span>`).join("")||'<span class="empty">none</span>'}</p><p><b style="font-size:12px;color:var(--mute)">Third-party patching ${tip("tpp")}</b><br>${sw.tpp.map(a=>`<span class="pill acc" style="margin:2px">${esc(a)}</span>`).join("")||'<span class="empty">none</span>'}</p>${own("sw")?`<button class="sm pri" data-act="swEdit" data-v="${p.id}">Edit software</button>`:""}`}
 if(t==="sec"){body=inh("av");body+=own("av")?`<div class="ctl"><div><div class="nm">Antivirus / EDR ${tip("av")}</div><div class="ds">Deploy and monitor endpoint protection</div></div><label class="sw"><input type="checkbox" ${p.av?"checked":""} data-act="avOn" data-v="${p.id}"><span></span></label></div>`:`<p class="ds" style="font-size:12px">Effective: antivirus ${e.av?"enabled":"disabled"}</p>`}
 if(t==="bk"){body=inh("backup");const b=own("backup")?p.backup:e.backup;body+=`<table><tr><td>Backup ${tip("backup")}</td><td>${b.enabled?'<span class="pill ok">enabled</span>':'<span class="pill">disabled</span>'}</td></tr>${b.enabled?`<tr><td>Type</td><td>${b.type}</td></tr><tr><td>Destination</td><td>${b.dest}</td></tr><tr><td>Schedule</td><td>Daily ${String(b.hour).padStart(2,"0")}:00</td></tr>`:""}</table>${own("backup")?`<button class="sm pri" style="margin-top:8px" data-act="bkEdit" data-v="${p.id}">Edit backup</button>`:""}`}
 return`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(p.name)}</h3><button class="sm" data-act="delPol" data-v="${p.id}">Delete</button></div>

 <div class="card"><div class="row" style="justify-content:space-between"><h3>Automations</h3><button class="pri" data-act="addScript">+ Add script</button></div>

function vPatch(){const W=S.devices.filter(d=>d.role.startsWith("Windows"));const kbs={};W.forEach(d=>d.patches.forEach(p=>{const k=kbs[p.kb]=kbs[p.kb]||{kb:p.kb,title:p.title,sev:p.sev,flagged:p.flagged,c:{}};k.c[p.state]=(k.c[p.state]||0)+1}));
 return`<h2>Patching ${tip("patch")}</h2><p class="sub">OS patches across all Windows devices. Settings live in each policy's Patching tab.</p>
 <div class="row" style="margin-bottom:12px"><button class="pri" data-act="ptues" data-tip="ptues">Release Patch Tuesday</button><button data-act="scanAll">Scan now</button><button data-act="applyAll" data-tip="window">Install approved now</button></div>
 <div class="grid g4" style="margin-bottom:12px">${stat(compliancePct(S.devices)+"%","Overall compliance","compliance")}${S.orgs.map(o=>stat(compliancePct(S.devices.filter(d=>d.orgId===o.id))+"%",esc(o.name))).join("")}</div>
 <div class="card"><h3>Patches by KB</h3>${Object.keys(kbs).length?`<div class="tw"><table><tr><th>KB</th><th>Title</th><th>Severity</th><th>Status across devices</th><th></th></tr>${Object.values(kbs).map(k=>`<tr><td>${k.kb}${k.flagged?` <span class="pill bad" data-tip="ai">AI flag</span>`:""}</td><td>${esc(k.title)}</td><td>${k.sev}</td><td>${Object.entries(k.c).map(([s,n])=>`${patchPill(s)} ${n}`).join(" ")}</td><td>${(k.c.held||k.c.available||k.c.new)?`<button class="sm" data-act="rejectKB" data-v="${k.kb}">Reject all</button>`:""}</td></tr>`).join("")}</table></div>`:'<div class="empty">No patches yet. Release Patch Tuesday.</div>'}</div>
 <div class="card" style="margin-top:12px"><h3>Manual review queue ${tip("approve")}</h3>${W.flatMap(d=>d.patches.filter(p=>p.state==="available"||p.state==="held").map(p=>`<div class="ctl"><div><div class="nm">${esc(d.name)} · ${p.kb} ${patchPill(p.state)}</div><div class="ds">${esc(p.title)} · ${p.sev}</div></div><div class="row"><button class="sm" data-act="approve" data-v="${p.id}">Approve</button><button class="sm" data-act="reject" data-v="${p.id}">Reject</button></div></div>`)).slice(0,40).join("")||'<div class="empty">Nothing awaiting review.</div>'}</div>`}

function vAlerts(){const act=S.alerts.filter(a=>a.status==="active");return`<h2>Alerts ${tip("alert")}</h2><p class="sub">Raised by policy conditions. They reset automatically when the condition clears.</p>
 <div class="card"><div class="tw"><table><tr><th>Severity ${tip("sev")}</th><th>Device</th><th>Organization</th><th>Condition</th><th>Since</th><th></th></tr>${act.map(a=>{const d=byId(S.devices,a.devId)||{};return`<tr><td>${sevPill(a.sev)}</td><td>${esc(d.name)}</td><td>${esc(orgName(d.orgId))}</td><td>${esc(a.msg)}</td><td style="font-size:12px">${clockStr(a.time)}</td>
 <td><div class="row"><button class="sm" data-act="selDev" data-v="${d.id}" onclick="S.tab='devs'">Device</button>${a.ticketId?`<span class="pill acc">#${byId(S.tickets,a.ticketId).num}</span>`:`<button class="sm" data-act="alertTicket" data-v="${a.id}">Create ticket</button>`}<button class="sm" data-act="resetAlert" data-v="${a.id}">Reset</button></div></td></tr>`}).join("")||'<tr><td colspan="6" class="empty">No active alerts.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:12px"><h3>Recently cleared</h3>${S.alerts.filter(a=>a.status==="reset").slice(-8).reverse().map(a=>`<div class="ctl"><div class="ds">${esc((byId(S.devices,a.devId)||{}).name)} — ${esc(a.msg)} ${a.auto?'<span class="pill ok">auto-remediated</span>':""}</div></div>`).join("")||'<div class="empty">None.</div>'}</div>`}

function vTix(){const cols=["Open","In Progress","Waiting","Resolved"];return`<h2>Ticketing ${tip("ticket")}</h2><p class="sub">SLA targets: P1 4h · P2 8h · P3 24h · P4 72h ${tip("sla")}</p>

 <div style="color:var(--mute)">${esc(orgName(t.orgId))} · ${esc(t.assignee)}</div><div style="color:${breach(t)?"var(--bad)":"var(--mute)"}">${t.status==="Resolved"?`resolved in ${age}h`:left>=0?`SLA: ${left}h left`:`SLA breached by ${-left}h`}</div></div>`}).join("")||'<div class="empty">—</div>'}</div>`}).join("")}</div>`}

function vBk(){const D=S.devices.filter(d=>devEff(d).backup.enabled||d.role.includes("Server"));return`<h2>Backup ${tip("backup")}</h2><p class="sub">Backup is configured per policy. Run on demand here, and prove recovery with restore tests ${tip("restore")}.</p>

 <td>${d.backup.status==="success"?`<span class="pill ok">success</span> ${clockStr(d.backup.last)}`:d.backup.status==="failed"?'<span class="pill bad">failed</span>':'<span class="pill">never</span>'}</td><td><div class="row"><button class="sm" data-act="runBk" data-v="${d.id}">Back up now</button><button class="sm" data-act="restoreTest" data-v="${d.id}" data-tip="restore">Test restore</button></div></td></tr>`}).join("")||'<tr><td colspan="5" class="empty">No servers or backup-enabled devices.</td></tr>'}</table></div>
 ${S.flags.restoreTested?'<p><span class="pill ok">Restore test passed</span></p>':""}</div>`}

function vScn(){const st=scnState();let cur="";if(st){const el=(S.scenario.end??S.clock)-S.scenario.start;
 cur=`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3>${esc(st.s.title)} <span class="pill">${st.s.lvl}</span></h3><div class="row"><button class="sm" data-act="askAI" data-v="hint" data-tip="assistant">✦ Get a hint</button><button class="sm dan" data-act="stopScn">End</button></div></div><p>${esc(st.s.desc)}</p>${bar(st.done/st.res.length*100)}

 <div class="grid g2">${SCN.map(s=>`<div class="card"><h3>${esc(s.title)} <span class="pill ${s.lvl==="Beginner"?"ok":s.lvl==="Advanced"?"bad":"warn"}">${s.lvl}</span></h3><p style="margin:0 0 8px">${esc(s.desc)}</p><div style="font-size:12px;color:var(--mute);margin-bottom:10px">${s.obj.length} objectives</div><button class="pri" data-act="startScn" data-v="${s.id}">${S.scenario&&S.scenario.id===s.id?"Restart":"Start"}</button></div>`).join("")}</div>`}

function openRemote(id){const d=byId(S.devices,id);if(!d.online)return toast(`${d.name} is offline. Remote access needs the agent online.`);
 log(`Remote session opened to ${d.name} (background mode)`);const root=document.getElementById("modalRoot");let out=`Connected to ${d.name} (${d.os}) — background mode, user not interrupted.\n`;
 const draw=(view="svc")=>{const svcs=[["Print Spooler",d.spooler],["Windows Update","running"],["DNS Client","running"],["Windows Defender",d.av==="running"?"running":d.av==="none"?"not installed":"stopped"]];
  root.innerHTML=`<div class="modal-bg"><div class="modal wide"><div class="row" style="justify-content:space-between"><h3>Remote session — ${esc(d.name)} ${tip("remote")}</h3><button data-x>End session</button></div>
  <div class="tabs">${[["svc","Services"],["term","Terminal"],["files","File transfer"],["proc","Processes"]].map(([k,l])=>`<button data-v="${k}" class="${view===k?"on":""}">${l}</button>`).join("")}</div>
  ${view==="svc"?`<table>${svcs.map(([n,s])=>`<tr><td>${n}</td><td><span class="pill ${s==="running"?"ok":"bad"}">${s}</span></td><td>${n==="Print Spooler"&&d.role.startsWith("Windows")?`<button class="sm" data-svc>Restart</button>`:""}</td></tr>`).join("")}</table>`:""}
  ${view==="term"?`<div class="row" style="margin-bottom:8px">${["ipconfig /flushdns","Get-PSDrive C","Get-Service Spooler","cleanmgr /sagerun:1"].map(c=>`<button class="sm" data-cmd="${c}">${c}</button>`).join("")}</div>`:""}
  ${view==="files"?`<p>Simulated file browser: C:\\Users\\${esc(d.user)}\\Documents</p><button class="sm" data-file>Download logs.zip to technician</button>`:""}
  ${view==="proc"?`<table><tr><th>Process</th><th>CPU</th></tr><tr><td>Teams.exe</td><td>${Math.round(d.cpu*.4)}%</td></tr><tr><td>chrome.exe</td><td>${Math.round(d.cpu*.3)}%</td></tr><tr><td>MsMpEng.exe</td><td>${Math.round(d.cpu*.1)}%</td></tr></table>`:""}
  <div class="term" style="margin-top:10px">${esc(out)}</div></div></div>`;
  root.querySelector("[data-x]").onclick=()=>{log(`Remote session to ${d.name} ended`);root.innerHTML="";commit()};

  const sv=root.querySelector("[data-svc]");if(sv)sv.onclick=()=>{if(d.spooler==="stopped"){d.spooler="running";S.flags.remoteFix=true;out+="> Restart-Service Spooler\nService 'Print Spooler' started.\n";log(`Print Spooler restarted on ${d.name} via remote session`,"ok");evaluate()}else out+="> Restart-Service Spooler\nService restarted (was already running).\n";draw("svc")};
  root.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const c=b.dataset.cmd;out+=`> ${c}\n`;
   if(c.startsWith("ipconfig"))out+="Successfully flushed the DNS Resolver Cache.\n";if(c==="Get-PSDrive C")out+=`C: Used ${d.disk}%  Free ${100-d.disk}%\n`;if(c==="Get-Service Spooler")out+=`Status: ${d.spooler}\n`;
   if(c.startsWith("cleanmgr")){const b0=d.disk;d.disk=Math.max(35,d.disk-12);out+=`Disk cleanup complete: ${b0}% → ${d.disk}%\n`;log(`Disk cleanup on ${d.name} via remote terminal`,"ok");evaluate()}draw("term")});
  const fl=root.querySelector("[data-file]");if(fl)fl.onclick=()=>{out+="Transferred logs.zip (2.4 MB)\n";log(`File transferred from ${d.name}`);draw("files")}};
 draw();return"__toast"}

 root.innerHTML=`<div class="modal-bg"><form class="modal"><div class="row" style="justify-content:space-between"><h3>Ticket #${t.num} ${sevPill(t.pri)}</h3><span class="pill">${esc(t.source)}</span></div><p><b>${esc(t.title)}</b><br><span style="color:var(--mute);font-size:12px">${esc(orgName(t.orgId))}${d?" · "+esc(d.name):""} · opened ${clockStr(t.created)}</span></p>

function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function form(title,fields,onSubmit){const html=fields.map(f=>{const lab=`<label>${esc(f.label)} ${f.tip?tip(f.tip):""}</label>`;
  if(f.type==="select")return`<div class="field">${lab}<select name="${f.k}">${f.options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(f.value)===String(v)?"selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
  if(f.type==="checks")return`<div class="field">${lab}<div class="checks">${f.options.map(([v,l])=>`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(f.value||[]).includes(v)?"checked":""}>${esc(l)}</label>`).join("")}</div></div>`;
  if(f.type==="checkbox")return`<div class="field"><label style="color:var(--text)"><input type="checkbox" name="${f.k}" style="width:auto" ${f.value?"checked":""}> ${esc(f.label)} ${f.tip?tip(f.tip):""}</label></div>`;
  if(f.type==="textarea")return`<div class="field">${lab}<textarea name="${f.k}" rows="3">${esc(f.value||"")}</textarea></div>`;
  return`<div class="field">${lab}<input name="${f.k}" type="${f.type||"text"}" value="${esc(f.value??"")}"></div>`}).join("");
 const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modal-bg"><form class="modal"><h3>${esc(title)}</h3>${html}<div id="ferr" style="color:#ffa198;min-height:18px;font-size:13px"></div><div class="row" style="justify-content:flex-end"><button type="button" data-close>Cancel</button><button class="pri" type="submit">OK</button></div></form></div>`;
 const fm=root.querySelector("form");fm.querySelector("[data-close]").onclick=closeModal;
 fm.onsubmit=e=>{e.preventDefault();const out={};fields.forEach(f=>{if(f.type==="checks")out[f.k]=[...fm.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);else if(f.type==="checkbox")out[f.k]=fm.querySelector(`input[name="${f.k}"]`).checked;else out[f.k]=fm.querySelector(`[name="${f.k}"]`).value.trim()});
  const err=onSubmit(out);if(err){fm.querySelector("#ferr").textContent=err;return}closeModal();commit()}}
function confirmBox(msg,yes){const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modal-bg"><div class="modal"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button data-n>Cancel</button><button class="pri" data-y>Confirm</button></div></div></div>`;
 root.querySelector("[data-n]").onclick=closeModal;root.querySelector("[data-y]").onclick=()=>{closeModal();yes()}}

 root.querySelector("[data-n]").onclick=()=>{closeModal();render()};return"__toast"}

function commit(){save();render()}
document.addEventListener("click",e=>{const ti=e.target.closest(".tip-ic");if(ti){e.preventDefault();e.stopPropagation();showTip(ti,true);return}
 if(e.target.closest("#modalRoot"))return;
 const el=e.target.closest("[data-act]");if(!el)return;if(el.closest("label.sw")&&e.target.tagName!=="INPUT")return;
 const fn=A[el.dataset.act];if(!fn)return;const r=el.dataset.k?fn(el.dataset.v,el.dataset.k):fn(el.dataset.v);if(r!=="__toast")commit();else save()});
const tipEl=document.getElementById("tip");let pinned=false;
function showTip(el,pin){const g=G[el.dataset.tip];if(!g)return;pinned=!!pin;
 tipEl.innerHTML=`<h4>${esc(g.t)}</h4><p>${esc(g.d)}</p><div class="k">How to</div><p>${esc(g.h)}</p>${g.a?`<div class="k">Alternatives</div><p>${esc(g.a)}</p>`:""}${pin?'<p style="font-size:11px;color:var(--mute);margin-top:8px">Tap anywhere to close</p>':""}`;
 tipEl.style.display="block";const r=el.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),innerWidth-tw-8),y=r.bottom+8;if(y+th>innerHeight-8)y=Math.max(8,r.top-th-8);tipEl.style.left=x+"px";tipEl.style.top=y+"px"}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned)showTip(el,false)});
document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned&&!el.contains(e.relatedTarget))tipEl.style.display="none"});
document.addEventListener("pointerdown",e=>{if(pinned&&!e.target.closest(".tip-ic")&&!e.target.closest("#tip")){pinned=false;tipEl.style.display="none"}},true);
/* ===================== AI ASSISTANT ===================== */
const AI={msgs:[],busy:false,sample:null,state:"loading",ctrl:null};
const AI_SUGG=["What should I do next in my scenario?","Why are my alerts firing?","Explain policy inheritance simply","How would Datto RMM or N-able do this?"];
const AI_SYS=`You are the Lab Assistant built into "RMM Lab Simulator", an independent training simulation modeled on NinjaOne-style RMM workflows (not affiliated with or endorsed by NinjaOne). The learner is practicing MSP / IT help-desk skills.

Your jobs:
1. Explain RMM and endpoint-management concepts clearly (policies, conditions, patching, automation, ticketing, backup, remote access, documentation), and mention how real products do it (NinjaOne, ConnectWise, Datto RMM, N-able, Kaseya, Atera, Intune) when useful.
2. Tell the learner exactly where to click in THIS simulator (UI map below).
3. Diagnose their lab using the tools: look up devices, policies, alerts and tickets rather than guessing.
4. Coach scenarios: if a scenario is running, give a hint for the next unfinished objective first; give the full step-by-step only if they ask for it.
5. You may call open_page to take the learner to a page or device when that helps. You cannot change settings yourself; tell the learner what to click.

Simulator UI map:
- Header: clock with "+1 hour" and "+1 day" (time only moves when advanced; schedules fire at their set hours), "Load sample MSP", "Reset".
- Dashboard: health KPIs and latest alerts.
- Organizations: "+ Add organization" (policy per device role), "+ Location", "Edit mapping", "Deploy agents" (installer per location), Documentation "+ Add" (Credential, Apps & Services, Network, Knowledge base).
- Devices: click a row → Remote session (Services/Terminal/File transfer/Processes), Run automation, Reboot, Policy override, Remove; tabs Overview/Patches/Software/Alerts.
- Policies: select a policy → tabs Conditions (+ Add condition: type, threshold, severity, Create ticket, Notify, Run automation), Scheduled automations (Daily 03:00 or Hourly), Patching (OS patching toggle, Hold AI-flagged patches toggle, Edit patch settings: scan/install hour, approval per severity, reboot), Software (install list, third-party patching), Security (antivirus), Backup (Image or File & Folder; Cloud/Local/Hybrid; hour). Child policies inherit; use "Override" to set their own.
- Automation Library: built-in scripts + "+ Add script".
- Patching: "Release Patch Tuesday", "Scan now", "Install approved now", per-KB status, manual review queue (Approve/Reject).
- Alerts: active alerts with Create ticket / Reset. Ticketing: board by status; open a ticket to set status, assignee, priority, add a note. SLA: P1 4h, P2 8h, P3 24h, P4 72h.
- Backup: per-device "Back up now" and "Test restore".
- Scenarios: start one; checklist with hints.

Style: the learner is often on a phone. Be brief: a short answer, then at most 5 bullets. Use **bold** for button and page names. No headings, no tables. If the question is unrelated to IT, answer briefly and steer back.`;
function aiCtx(){const act=S.alerts.filter(a=>a.status==="active");const st=scnState();const d=byId(S.devices,S.sel);
 return JSON.stringify({clock:clockStr(),page:(TABS.find(t=>t[0]===S.tab)||[])[1],selectedDevice:d?d.name:null,
  scenario:st?{title:st.s.title,objectives:st.s.obj.map((o,i)=>({objective:o[0],done:st.res[i],hint:o[2]}))}:null,
  orgs:S.orgs.map(o=>({name:o.name,devices:S.devices.filter(x=>x.orgId===o.id).length,patchCompliance:compliancePct(S.devices.filter(x=>x.orgId===o.id))+"%"})),
  policies:S.policies.map(p=>p.name),activeAlerts:act.slice(-10).map(a=>({device:(byId(S.devices,a.devId)||{}).name,sev:a.sev,cond:a.msg})),
  openTickets:S.tickets.filter(t=>t.status!=="Resolved").slice(0,10).map(t=>({num:t.num,pri:t.pri,title:t.title,assignee:t.assignee,breach:breach(t)}))})}
function devSummary(x){const e=devEff(x);return{name:x.name,org:orgName(x.orgId),location:locName(x.locId),role:x.role,os:x.os,online:x.online,diskPct:x.disk,cpuPct:x.cpu,printSpooler:x.spooler,pendingReboot:x.pendingReboot,
 antivirus:x.av,backup:x.backup.status,apps:x.apps,outdatedApps:x.outdated,effectivePolicy:e.name,policyOverride:!!x.override,
 patches:x.patches.map(p=>`${p.kb} ${p.sev} ${p.state}${p.flagged?" AI-flagged":""}`),activeAlerts:devAlerts(x).map(a=>a.sev+": "+a.msg)}}
function polSummary(p){const e=eff(p.id);return{name:p.name,role:p.role,parent:(byId(S.policies,p.parentId)||{}).name||null,
 ownConditions:p.conds.map(c=>({cond:condLabel(c),sev:c.sev,ticket:c.ticket,notify:c.notify,runs:(byId(S.scripts,c.script)||{}).name||null})),
 effectiveConditions:e.conds.map(condLabel),scheduledAutomations:e.autos.map(a=>`${(byId(S.scripts,a.script)||{}).name} (${a.sched})`),
 patching:e.patch,software:e.sw,antivirus:e.av,backup:e.backup,usedByDevices:S.devices.filter(d=>devPolicyId(d)===p.id).map(d=>d.name),inheritsPatch:p.parentId&&p.patch===null}}
const findBy=(arr,name)=>{const n=String(name||"").toLowerCase();return arr.find(x=>x.name.toLowerCase()===n)||arr.find(x=>x.name.toLowerCase().includes(n))};
const AI_TOOLS=[
 {name:"list_devices",description:"List managed devices with health summary. Optional organization filter.",inputSchema:{type:"object",properties:{organization:{type:"string"}}},
  execute({organization}={}){const o=organization?findBy(S.orgs,organization):null;return S.devices.filter(x=>!o||x.orgId===o.id).map(x=>({name:x.name,org:orgName(x.orgId),role:x.role,online:x.online,disk:x.disk,alerts:devAlerts(x).length,pendingPatches:x.patches.filter(p=>["new","available","approved","held"].includes(p.state)).length}))}},
 {name:"get_device",description:"Full details for one device by name (e.g. HCL-WS03).",inputSchema:{type:"object",properties:{name:{type:"string"}},required:["name"]},
  execute({name}){const x=findBy(S.devices,name);if(!x)throw new Error("No device named "+name);return devSummary(x)}},
 {name:"get_policy",description:"Configuration of an agent policy by name, including inherited (effective) settings.",inputSchema:{type:"object",properties:{name:{type:"string"}},required:["name"]},
  execute({name}){const p=findBy(S.policies,name);if(!p)throw new Error("No policy named "+name+". Policies: "+S.policies.map(x=>x.name).join("; "));return polSummary(p)}},
 {name:"list_tickets",description:"All tickets with status, priority, assignee, SLA state and notes.",inputSchema:{type:"object",properties:{}},
  execute(){return S.tickets.map(t=>({num:t.num,title:t.title,org:orgName(t.orgId),device:(byId(S.devices,t.devId)||{}).name||null,pri:t.pri,status:t.status,assignee:t.assignee,ageHours:(t.resolvedAt??S.clock)-t.created,slaHours:SLA[t.pri],breach:breach(t),notes:t.notes.length}))}},
 {name:"recent_activity",description:"The 25 most recent activity log entries (what the simulator just did).",inputSchema:{type:"object",properties:{}},execute(){return S.log.slice(0,25).map(l=>`[${l.t}] ${l.msg}`)}},
 {name:"glossary",description:"The simulator's built-in definition, how-to and alternatives for a term (e.g. 'patch approval', 'compound condition', 'SLA').",inputSchema:{type:"object",properties:{term:{type:"string"}},required:["term"]},
  execute({term}){const t=String(term).toLowerCase();const hit=Object.values(G).find(g=>g.t.toLowerCase().includes(t))||G[t];return hit||{note:"No glossary entry; answer from general knowledge."}}},
 {name:"open_page",description:"Navigate the learner's screen to a page, optionally opening a device. page is one of: dash, orgs, devs, pols, lib, patch, alerts, tix, bk, scn.",inputSchema:{type:"object",properties:{page:{type:"string"},device:{type:"string"},policy:{type:"string"}},required:["page"]},
  execute({page,device,policy}){if(!TABS.some(t=>t[0]===page))throw new Error("Unknown page");S.tab=page;if(device){const x=findBy(S.devices,device);if(x){S.sel=x.id;S.tab="devs"}}if(policy){const p=findBy(S.policies,policy);if(p){S.polSel=p.id;S.tab="pols"}}commit();return{ok:true,now:page}}}];
function aiMd(s){const lines=esc(s).split("\n");let out="",inL=false;for(let l of lines){l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
 const m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);if(m){if(!inL){out+="<ul>";inL=true}out+=`<li>${m[1]}</li>`}else{if(inL){out+="</ul>";inL=false}if(l.trim())out+=`<div>${l.replace(/^#+\s*/,"")}</div>`}}return out+(inL?"</ul>":"")}
function aiDraw(){const box=document.getElementById("aiMsgs");
 if(AI.state==="off")box.innerHTML=`<div class="am a">The AI assistant isn't available in this view. Open the simulator from its claude.ai page while signed in to use it. Hover tips and scenario hints still work.</div>`;
 else box.innerHTML=(AI.msgs.length?"":`<div class="am a">Hi! I can explain RMM concepts, show you where to click, check your lab (devices, policies, alerts, tickets), and coach you through scenarios. What do you need?</div>`)+
  AI.msgs.map(m=>`<div class="am ${m.role==="user"?"u":m.err?"err":"a"}">${m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):aiMd(m.content||"…")}${m.tools&&m.tools.length?`<div class="tool">🔎 ${m.tools.map(esc).join(", ")}</div>`:""}</div>`).join("");
 box.scrollTop=box.scrollHeight;
 document.getElementById("aiSugg").innerHTML=AI.state==="on"&&!AI.busy&&AI.msgs.length<2?AI_SUGG.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join(""):"";
 const send=document.getElementById("aiSend");send.textContent=AI.busy?"Stop":"Send";document.getElementById("aiIn").disabled=AI.state==="off"}
function aiToggle(open){const p=document.getElementById("aiPanel");const o=open??!p.classList.contains("open");p.classList.toggle("open",o);if(o){aiDraw();if(innerWidth>760)document.getElementById("aiIn").focus()}}
async function aiAsk(q){q=String(q||"").trim();if(!q||AI.busy)return;aiToggle(true);if(AI.state!=="on"){aiDraw();return}
 AI.msgs.push({role:"user",content:q});const reply={role:"assistant",content:"",tools:[]};AI.msgs.push(reply);AI.busy=true;aiDraw();
 const hist=AI.msgs.slice(0,-1).filter(m=>!m.err&&m.content).slice(-12).map(m=>({role:m.role,content:m.content}));
 hist[hist.length-1]={role:"user",content:`${AI_SYS}\n\nCurrent lab context (JSON):\n${aiCtx()}\n\nLearner: ${q}`};
 if(hist[0].role!=="user")hist.shift();
 AI.ctrl=new AbortController();
 const tools=AI_TOOLS.map(t=>({...t,execute:async inp=>{reply.tools.push(t.name.replace("_"," "));aiDraw();return t.execute(inp||{})}}));
 try{const r=await AI.sample(hist,{onText:({text})=>{reply.content=text;aiDraw()},signal:AI.ctrl.signal,tools,cache:false,modelTier:"default"});reply.content=r.text||reply.content||"(no answer)";if(r.truncated)reply.content+="\n\n(answer cut short — ask me to continue)"}
 catch(e){if(e&&e.name==="AbortError"){reply.content=(reply.content||"")+"\n\n(stopped)"}
  else if(e&&e.code==="not_granted"){AI.state="off";AI.msgs.pop()}
  else{reply.err=true;reply.content=e&&e.code==="rate_limited"?"I'm getting too many requests right now. Wait a minute and try again.":"Something went wrong reaching the assistant"+(e&&e.message?`: ${e.message}`:".")+" Try again."}}
 AI.busy=false;AI.ctrl=null;aiDraw()}
(function aiInit(){const btn=document.getElementById("aiBtn"),panel=document.getElementById("aiPanel");
 btn.addEventListener("click",()=>aiToggle());document.getElementById("aiClose").onclick=()=>aiToggle(false);
 document.getElementById("aiClear").onclick=()=>{if(AI.ctrl)AI.ctrl.abort();AI.msgs=[];aiDraw()};
 document.getElementById("aiForm").onsubmit=e=>{e.preventDefault();if(AI.busy){AI.ctrl&&AI.ctrl.abort();return}const i=document.getElementById("aiIn");const q=i.value;i.value="";aiAsk(q)};
 document.getElementById("aiIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>760){e.preventDefault();document.getElementById("aiForm").requestSubmit()}});
 document.getElementById("aiSugg").addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(b)aiAsk(b.dataset.q)});
 let tries=0;const connect=async()=>{if(window.claude&&typeof window.claude.use==="function"){try{AI.sample=await window.claude.use("sample")}catch(e){AI.sample=null}AI.state=AI.sample?"on":"off";aiDraw();return}
  if(++tries<30)setTimeout(connect,200);else{AI.state="off";aiDraw()}};connect()})();
A.askAI=v=>{const d=byId(S.devices,S.sel);aiAsk(v==="dev"&&d?`Check ${d.name} for me: is anything wrong or needing attention, and what should I do about it in this simulator?`:"Give me a hint for the next unfinished objective in my scenario. Don't give the full solution yet.")};
if(!S.log.length)log("Welcome. Click 'Load sample MSP' or start a scenario. Hover (or tap) any ? for help.");
if(innerWidth<760)document.getElementById("log").classList.add("min");
render();
