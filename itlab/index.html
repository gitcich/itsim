<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Lab Simulator</title>
<style>
:root{
  --bg:#0f1419;--panel:#171e26;--panel2:#1e2731;--line:#2a3542;--text:#dbe3ec;--mute:#8a99a8;
  --acc:#1d9bd1;--acc2:#0b6e99;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--chip:#243241;
}
body.ms{--acc:#3b8eea;--acc2:#1f5fb4;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:6px;padding:6px 11px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc2);border-color:var(--acc)}
button.dan{border-color:#6b2a2a;color:#ffb3ae}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;background:#0d1217;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600}
header .brand{display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 10px}
.seg button.on{background:var(--acc2)}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 52px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
nav button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;margin-bottom:2px;gap:8px;align-items:center}
nav button.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
main{padding:16px;min-width:0}
.banner{font-size:12px;color:var(--mute);margin-bottom:12px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sub{color:var(--mute);margin:0 0 14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stat .n{font-size:26px;font-weight:600}
.stat .l{color:var(--mute);font-size:12px;display:flex;gap:4px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:var(--chip);white-space:nowrap}
.pill.ok{background:#173d22;color:#7ee28f}.pill.bad{background:#4a1c1c;color:#ffa198}.pill.warn{background:#3d3012;color:#f0c86a}.pill.acc{background:#13344a;color:#8fd0f5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:7px;background:#0d1217;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.hot{background:var(--warn)}.bar i.crit{background:var(--bad)}
.tip-ic{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:10px;font-weight:700;cursor:help;flex:none;user-select:none}
.tip-ic:hover{border-color:var(--acc);color:var(--acc)}
[data-tip]{cursor:help}
#tip{position:fixed;z-index:100;max-width:360px;background:#0b1015;border:1px solid var(--acc);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px #000a;display:none;font-size:13px}
#tip h4{margin:0 0 6px;font-size:14px;color:var(--acc)}
#tip .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-top:8px}
#tip p{margin:2px 0}
#log{position:fixed;right:12px;bottom:12px;width:380px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:30;box-shadow:0 8px 24px #0008}
#log .hd{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mute)}
#log .bd{max-height:180px;overflow:auto;padding:6px 10px;font:12px/1.5 ui-monospace,Consolas,monospace}
#log.min .bd{display:none}
.lg-ok{color:#7ee28f}.lg-bad{color:#ffa198}.lg-warn{color:#f0c86a}.lg-info{color:#9fb3c8}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.field{margin-bottom:11px}
.field label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:5px;align-items:center;background:var(--panel2);padding:4px 8px;border-radius:6px;color:var(--text);font-size:12px}
.checks input{width:auto}
.topo{display:flex;flex-wrap:wrap;gap:12px}
.clu{border:1px dashed var(--acc);border-radius:10px;padding:10px;min-width:220px}
.clu .t{font-size:12px;color:var(--acc);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.hostbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;min-width:200px}
.hostbox.failed{border-color:var(--bad)}.hostbox.maintenance{border-color:var(--warn)}
.vmchip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;margin:2px;background:#13344a}
.vmchip.off{background:#2a2f36;color:var(--mute)}.vmchip.down{background:#4a1c1c}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl .nm{font-weight:500;display:flex;gap:6px;align-items:center}
.ctl .ds{font-size:12px;color:var(--mute)}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a3542;border-radius:22px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#cfd8e2;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(18px)}
.obj{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.obj .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.obj.done .ck{background:var(--ok);border-color:var(--ok);color:#06210c}
.obj .hint{font-size:12px;color:var(--mute)}
.scbar{background:#122130;border:1px solid var(--acc2);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.empty{color:var(--mute);font-style:italic;padding:8px 0}
.score{font-size:40px;font-weight:700}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  nav button{width:auto;white-space:nowrap;margin:0 2px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}
  main{padding:12px;padding-bottom:70px}
  #log{width:auto;left:12px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">IT</div><h1>IT Lab Simulator</h1></div>
  <span class="tip-ic" data-tip="console">?</span>
  <div class="seg" id="platSeg">
    <button data-act="plat" data-v="vmware">VMware vSphere</button>
    <button data-act="plat" data-v="microsoft">Microsoft Hyper-V</button>
  </div>
  <div class="spacer"></div>
  <button data-act="sample">Load sample environment</button>
  <button class="dan" data-act="reset">Reset lab</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="log"><div class="hd" data-act="logtoggle"><span>Event log / task console</span><span id="logcount"></span></div><div class="bd" id="logbd"></div></div>
<div id="tip"></div>
<div id="modalRoot"></div>

<script>
/* ===================== GLOSSARY (hover tips) ===================== */
const G={
console:{t:"Console style",d:"Switches the simulator's terminology and default hypervisor between a VMware vSphere-style console and a Microsoft Hyper-V / System Center-style console.",h:"Pick the style you want to practice. Hosts you add default to that hypervisor; you can mix both in one lab, just as many real companies do during migrations.",a:"Other management planes: Proxmox VE web UI, Nutanix Prism, XCP-ng Xen Orchestra, Azure portal / Azure Arc for hybrid."},
hypervisor:{t:"Hypervisor",d:"Software that runs directly on server hardware (Type 1) and carves it into isolated virtual machines, sharing CPU, memory, storage and network.",h:"Install it on each physical host, then manage hosts centrally (vCenter or SCVMM/Windows Admin Center).",a:"VMware ESXi, Microsoft Hyper-V, Proxmox VE (KVM), Nutanix AHV, XCP-ng/XenServer, Red Hat OpenShift Virtualization."},
host:{t:"Physical host",d:"A rack server (e.g., Dell PowerEdge, HPE ProLiant, Lenovo ThinkSystem) running a hypervisor. Its cores and RAM are the pool your VMs draw from.",h:"Datacenter → Add host. Choose vendor, hypervisor, cores and RAM. Present shared storage to it and join it to a cluster for HA.",a:"Hyperconverged appliances (Nutanix, Dell VxRail, Azure Local) bundle compute + storage. Cloud IaaS (Azure VMs, AWS EC2) removes hardware entirely."},
esxi:{t:"VMware ESXi",d:"VMware's bare-metal hypervisor, now part of Broadcom's VMware Cloud Foundation (VCF) / vSphere Foundation licensing.",h:"Install from ISO, set management IP via DCUI, then add the host to vCenter.",a:"Many orgs evaluating alternatives after the Broadcom licensing changes look at Hyper-V, Proxmox VE, Nutanix AHV or moving workloads to Azure/AWS."},
hyperv:{t:"Microsoft Hyper-V",d:"Microsoft's Type 1 hypervisor built into Windows Server (and Azure Local, formerly Azure Stack HCI).",h:"Install-WindowsFeature Hyper-V -IncludeManagementTools, create a virtual switch, then manage via Hyper-V Manager, Windows Admin Center or SCVMM.",a:"VMware ESXi, Proxmox VE, Nutanix AHV, XCP-ng."},
mgr:{t:"Central management",d:"vCenter Server (VMware) or System Center Virtual Machine Manager / Windows Admin Center (Microsoft) manage many hosts as one: clusters, migration, templates, permissions.",h:"Deploy the management appliance/server first, then add hosts. Back it up — it is a critical dependency.",a:"Proxmox cluster UI, Nutanix Prism Central, Azure Arc, Xen Orchestra."},
cluster:{t:"Cluster",d:"A group of hosts managed as a single pool. Enables High Availability (restart VMs if a host dies) and load balancing.",h:"Datacenter → Create cluster, then assign hosts. All members should share storage and networks. Hyper-V Failover Clusters need matching Hyper-V hosts; vSphere clusters need ESXi hosts.",a:"Proxmox HA cluster, Nutanix cluster, Kubernetes (for containers rather than VMs)."},
ha:{t:"High Availability (HA)",d:"If a host fails, the cluster automatically restarts its VMs on surviving hosts. There is a short outage (reboot time), not zero downtime.",h:"Enable HA on the cluster. Requires 2+ hosts, shared storage visible to all of them, and spare capacity (N+1) to absorb a failed host's VMs.",a:"VMware Fault Tolerance (zero-downtime mirror for small VMs), application-level clustering (SQL Always On, DAG for Exchange)."},
drs:{t:"Load balancing (DRS / Dynamic Optimization)",d:"Automatically moves running VMs between hosts to balance load, and evacuates hosts entering maintenance.",h:"Enable on the cluster. In this sim, DRS lets maintenance mode auto-migrate VMs off a host.",a:"VMware DRS, SCVMM Dynamic Optimization, Hyper-V cluster node fairness, Proxmox CRS."},
mig:{t:"Live migration (vMotion / Live Migration)",d:"Moves a running VM to another host with no downtime by copying memory state over the network.",h:"Both hosts must be online, run the same hypervisor, and see the VM's shared storage. Otherwise, power the VM off and do a cold migration.",a:"Storage vMotion / Storage Live Migration move the disks instead of the compute; shared-nothing live migration moves both."},
snap:{t:"Snapshot / Checkpoint",d:"A point-in-time capture of a VM's disk (and optionally memory) so you can roll back after a change.",h:"Take one before patching or upgrades, then delete it once the change is verified. Snapshots are NOT backups — they live on the same storage and degrade performance if kept long.",a:"Storage-array snapshots, backup software (Veeam, Commvault, Rubrik, Azure Backup)."},
maint:{t:"Maintenance mode",d:"Takes a host out of service safely for patching or hardware work. Running VMs must be moved off first.",h:"If the host is in a cluster with load balancing on, VMs are evacuated automatically. Otherwise migrate or shut down VMs yourself.",a:"Hyper-V: 'Pause → Drain Roles'. Proxmox: node maintenance mode."},
failure:{t:"Host failure test",d:"Simulates a host losing power or crashing — a standard resilience test to prove your HA design works.",h:"Run it on a host with running VMs. With HA, shared storage and spare capacity, VMs restart elsewhere. Without them, they stay down until the host is repaired.",a:"Real-world: planned failover tests, chaos engineering tools (in cloud) and DR runbooks."},
vm:{t:"Virtual machine",d:"A software computer with virtual CPU, RAM, disk and NIC, running its own OS on a host.",h:"Virtualization → New VM. Pick a role, size it, place it on a host, attach it to a network/VLAN and a datastore.",a:"Containers (Docker/Kubernetes) for app workloads, PaaS (Azure App Service), or cloud VMs."},
vcpu:{t:"vCPU",d:"A virtual processor mapped to a physical core's time. Hosts can be overcommitted (more vCPUs than cores) because most VMs idle.",h:"Start small (2 vCPU) and grow. This sim allows up to 4 vCPU per physical core.",a:"Sizing tools: VMware Aria Operations, Azure Migrate assessment, RVTools for inventory."},
ram:{t:"Memory (GB)",d:"RAM assigned to a VM. Unlike CPU, memory overcommit is risky; this sim does not allow powered-on VMs to exceed host RAM.",h:"Size to the workload: DCs ~4–8 GB, file servers 8 GB, SQL 16 GB+.",a:"Hyper-V Dynamic Memory and VMware ballooning reclaim idle RAM."},
overcommit:{t:"Capacity & overcommit",d:"How much of the host's physical resources are allocated. High utilization means no room to absorb a failed host.",h:"Keep clusters at N+1: total load should fit even with your biggest host down.",a:"Capacity planning tools: Aria Operations, SCOM, Azure Monitor."},
role:{t:"Server role",d:"The job the VM performs. Some features require a role: a Domain Controller to create AD, a DHCP role to hand out addresses, a Backup Server for backup jobs.",h:"Choose when creating the VM. Domain Controllers also provide DNS.",a:"Many roles can move to SaaS: Entra ID for identity, SharePoint/OneDrive for files, cloud backup services."},
datastore:{t:"Datastore / Shared storage",d:"Where VM disks live. Shared storage visible to multiple hosts is what makes HA and live migration possible.",h:"Datacenter → Add storage, then present it to the hosts that should see it.",a:"See SAN, NAS, vSAN and S2D tips."},
san:{t:"SAN (iSCSI / Fibre Channel)",d:"Block storage on a dedicated array, presented to hosts as LUNs. Shared across hosts.",h:"Use separate storage VLANs/fabric, multipathing (MPIO) and jumbo frames for iSCSI.",a:"Pure Storage, NetApp, Dell PowerStore, HPE Alletra; or go hyperconverged."},
nas:{t:"NAS (NFS / SMB 3)",d:"File-level shared storage. VMware uses NFS datastores; Hyper-V can use SMB 3 shares.",h:"Present the export/share to all cluster hosts with proper permissions.",a:"NetApp, Synology, TrueNAS, Windows Scale-Out File Server."},
vsan:{t:"VMware vSAN",d:"Hyperconverged storage: pools local disks of each ESXi host into one shared datastore.",h:"Needs 3+ hosts (2 with a witness) and supported disks/NICs. Shared only with vSphere hosts.",a:"Microsoft S2D, Nutanix, Ceph (Proxmox), StarWind VSAN."},
s2d:{t:"Storage Spaces Direct (S2D)",d:"Microsoft's hyperconverged storage: pools local disks across Hyper-V cluster nodes into Cluster Shared Volumes.",h:"Requires Windows Server Datacenter or Azure Local, 2+ nodes, RDMA networking recommended.",a:"VMware vSAN, Nutanix, Ceph, StarWind."},
local:{t:"Local disk",d:"Storage inside one host. Fast and cheap, but VMs on it cannot fail over or live-migrate without moving their disks.",h:"Fine for labs or non-critical VMs.",a:"Use shared or hyperconverged storage for anything that needs HA."},
vlan:{t:"VLAN",d:"A virtual LAN: splits one physical network into isolated broadcast domains identified by a tag (1–4094).",h:"Network → Add VLAN with an ID, name and subnet. Typical layout: Management, Servers, Users, Storage, Guest, DMZ.",a:"Overlay networking: VMware NSX segments, Hyper-V SDN / VXLAN, cloud VNets/VPCs."},
subnet:{t:"Subnet (CIDR)",d:"An IP address range such as 10.10.20.0/24 (254 usable addresses). Each VLAN usually maps to one subnet.",h:"Plan non-overlapping ranges per site so VPNs can route between them.",a:"IPAM tools: Windows IPAM, Infoblox, NetBox, phpIPAM."},
vswitch:{t:"Virtual switch",d:"Software switch inside the hypervisor connecting VM NICs to physical uplinks and VLANs.",h:"VMware: Standard (per-host) or Distributed (vCenter-wide) switch with port groups. Hyper-V: External/Internal/Private switch, or Switch Embedded Teaming (SET).",a:"VMware NSX, Open vSwitch (Proxmox/KVM), Cisco ACI integration."},
firewall:{t:"Firewall rules",d:"Ordered allow/deny rules controlling which sources can reach which destinations and ports.",h:"Network → Add rule. Allow only what's needed (e.g., Users → Servers on 443, 445) and end with a default-deny rule.",a:"Palo Alto, Fortinet FortiGate, Cisco Firepower, pfSense/OPNsense, VMware NSX distributed firewall, Windows Defender Firewall via GPO, Azure Firewall."},
defaultdeny:{t:"Default deny",d:"A final rule that blocks anything not explicitly allowed — a core principle of least privilege.",h:"Add a rule with source any, destination any, port any, action Deny, at the bottom.",a:"Zero Trust network access (ZTNA) products extend the same idea to remote users."},
dns:{t:"DNS",d:"Translates names (fs01.corp.local) into IP addresses. Active Directory depends on it completely.",h:"Created automatically with your AD domain. Add A records for servers and CNAMEs for friendly names.",a:"BIND, Infoblox, Azure DNS / Route 53 for public zones, Cloudflare."},
dhcp:{t:"DHCP",d:"Automatically gives clients an IP, gateway and DNS server.",h:"Requires a VM with the DHCP Server or Domain Controller role. Create one scope per client VLAN; servers usually get static IPs.",a:"Router/firewall DHCP, ISC Kea, Infoblox."},
vpn:{t:"Site-to-site VPN",d:"An encrypted IPsec tunnel joining two sites' networks over the internet.",h:"Network → Add VPN. Both ends need matching settings and non-overlapping subnets.",a:"SD-WAN (Fortinet, Cisco Meraki, VMware VeloCloud), Azure VPN Gateway, WireGuard, private circuits (MPLS / ExpressRoute)."},
ad:{t:"Active Directory Domain Services",d:"Microsoft's on-premises directory: users, computers, groups and policies, with Kerberos authentication.",h:"Build a VM with the Domain Controller role, power it on, then Identity → Create domain. Build at least two DCs in production.",a:"Microsoft Entra ID (cloud-only), Samba AD, FreeIPA, JumpCloud, Okta Universal Directory."},
dc:{t:"Domain Controller",d:"A server holding a copy of the AD database and answering logins. Also normally runs DNS.",h:"Run 2+ DCs on different hosts. Never snapshot-revert a DC in production.",a:"Read-Only DCs (RODC) for branch offices with weak physical security."},
rodc:{t:"Read-Only Domain Controller",d:"A DC holding a read-only copy of AD, for branch offices where the server isn't physically secure.",h:"Create a VM with the RODC role at the branch site.",a:"Or skip branch DCs entirely and authenticate over VPN/SD-WAN or via Entra ID."},
ou:{t:"Organizational Unit (OU)",d:"A folder in AD for organizing users and computers so you can delegate admin rights and link Group Policy.",h:"Create OUs by function or location (Users, Servers, Workstations, Branch).",a:"Entra ID uses administrative units and dynamic groups instead."},
user:{t:"User accounts",d:"Identities people sign in with. Should map to one person each — no shared accounts.",h:"Add users into an OU and group. Separate admin accounts from daily-use accounts.",a:"Automate onboarding with HR-driven provisioning (Entra, Okta, SailPoint)."},
group:{t:"Security groups",d:"Collections of users used to grant access. Assign permissions to groups, never to individual users.",h:"Example: GRP-Finance gets the Finance share; GRP-Helpdesk gets password-reset rights.",a:"Entra dynamic groups, Okta groups."},
gpo:{t:"Group Policy Object (GPO)",d:"A bundle of settings pushed to computers and users in an OU: password rules, security baselines, BitLocker, drive maps, updates.",h:"Identity → New GPO, choose a setting and link it to an OU.",a:"Microsoft Intune configuration profiles, Ansible, Puppet, Chef, Jamf (Mac)."},
entra:{t:"Microsoft Entra Connect / Cloud Sync",d:"Synchronizes on-prem AD users and groups to Microsoft Entra ID (formerly Azure AD) so one identity works for Microsoft 365 and SaaS. This is 'hybrid identity'.",h:"Requires an AD domain. Install the sync agent on a server and choose password hash sync or pass-through auth.",a:"Okta AD Agent, JumpCloud AD Bridge, Google Cloud Directory Sync."},
mfa:{t:"Multi-factor authentication",d:"Requires a second proof (authenticator app, FIDO2 key, phone) besides a password. Blocks the vast majority of account takeovers.",h:"Requires users to exist. Enforce via Conditional Access for all users, admins first. Prefer phishing-resistant methods (FIDO2/passkeys).",a:"Microsoft Entra MFA, Duo, Okta Verify, YubiKey hardware keys."},
edr:{t:"Endpoint Detection & Response",d:"Agents on servers and PCs that monitor behavior, alert on suspicious activity and can isolate a machine.",h:"Deploy to every VM; onboard via GPO, Intune or script.",a:"Microsoft Defender for Endpoint, CrowdStrike Falcon, SentinelOne, Sophos."},
patch:{t:"Patch management",d:"Regularly applying OS, hypervisor and firmware updates.",h:"Enable a patching service, then put each host in maintenance mode and patch it. Patch VMs on a schedule with a test ring first.",a:"Azure Update Manager, Intune, vSphere Lifecycle Manager (vLCM), SCCM/ConfigMgr, NinjaOne, ConnectWise. Note: Microsoft has deprecated WSUS for new feature work."},
siem:{t:"SIEM / log collection",d:"Centralizes logs from servers, firewalls and identity systems so you can search, alert and investigate.",h:"Forward Windows event logs, firewall logs and vCenter/SCVMM logs to the SIEM.",a:"Microsoft Sentinel, Splunk, Elastic Security, Google SecOps, Wazuh (open source)."},
pam:{t:"Privileged access management",d:"Controls admin rights: just-in-time elevation, vaulted passwords, session recording, separate admin accounts.",h:"Remove standing Domain Admin membership; grant elevation on request with approval.",a:"Entra Privileged Identity Management, CyberArk, Delinea, BeyondTrust."},
laps:{t:"Windows LAPS",d:"Gives every computer a unique, rotating local administrator password stored in AD/Entra.",h:"Built into current Windows; enable via GPO or Intune.",a:"PAM vaults can rotate local admin passwords too."},
baseline:{t:"Security baseline",d:"A tested set of hardening settings (from Microsoft or CIS) applied consistently to all machines.",h:"Create a GPO with the 'Security baseline' setting and link it to your Servers/Workstations OU.",a:"CIS Benchmarks, DISA STIGs, Intune security baselines, VMware vSphere Security Configuration Guide."},
backup:{t:"Backup jobs",d:"Scheduled copies of VMs to a separate repository so you can recover from failure, deletion or corruption.",h:"Requires a VM with the Backup Server role. Select critical VMs, choose a target. Follow 3-2-1: 3 copies, 2 media, 1 offsite (plus 1 immutable).",a:"Veeam, Commvault, Rubrik, Cohesity, Azure Backup, Nakivo."},
immutable:{t:"Immutable backup",d:"A backup copy that cannot be modified or deleted until its retention period ends — even by an administrator.",h:"Use a hardened Linux repository, object storage with Object Lock, or an immutable cloud vault.",a:"Veeam Hardened Repository, AWS S3 Object Lock, Azure immutable blob storage, Wasabi."},
offsite:{t:"Offsite copy",d:"A backup copy stored at a different site or cloud, so a site-wide disaster doesn't destroy both production and backups.",h:"Add a job with an Offsite/Cloud target, or a copy job.",a:"Cloud object storage, a secondary datacenter, tape vaulting."},
restore:{t:"Restore test",d:"Actually recovering a VM from backup to prove it works. An untested backup is a hope, not a plan.",h:"Run restore tests on a schedule (e.g., quarterly) into an isolated network.",a:"Veeam SureBackup / Rubrik automated recovery testing."},
rpo:{t:"RPO / RTO",d:"Recovery Point Objective = how much data you can afford to lose (time between backups). Recovery Time Objective = how long you can be down.",h:"Agree on these with the business per application, then design backup frequency and DR to meet them.",a:"DR orchestration: Azure Site Recovery, VMware Live Recovery (SRM), Zerto."},

/* ===================== DERIVED ===================== */
function hostUse(h){const vms=S.vms.filter(v=>v.hostId===h.id&&v.power==="on");return{vcpu:vms.reduce((a,v)=>a+v.vcpu,0),ram:vms.reduce((a,v)=>a+v.ram,0),count:S.vms.filter(v=>v.hostId===h.id).length}}
function fits(h,vm){const u=hostUse(h);return u.vcpu+vm.vcpu<=h.cpu*4&&u.ram+vm.ram<=h.ram}
function isShared(st){return st&&st.type!=="local"}
function hostSees(h,stId){const st=byId(S.storage,stId);return st&&st.hostIds.includes(h.id)}
function vmsByRole(r){return S.vms.filter(v=>v.role===r)}
function runningRole(r){return S.vms.some(v=>v.role===r&&v.power==="on")}
function backedUp(vm){return S.backups.some(b=>b.vmIds.includes(vm.id))}
function posture(){
 const checks=[
  ["MFA enforced",S.sec.mfa],["EDR on endpoints",S.sec.edr],["Patch management",S.sec.patch],["Central logging (SIEM)",S.sec.siem],
  ["Privileged access mgmt",S.sec.pam],["Security baseline GPO",S.ad.gpos.some(g=>g.setting==="Security baseline")],
  ["Windows LAPS",S.ad.gpos.some(g=>g.setting==="Windows LAPS")],["Default-deny firewall",S.fw.some(r=>r.action==="Deny"&&r.src==="any"&&r.dst==="any")],
  ["Critical VMs backed up",critCovered()],["Immutable backup copy",S.backups.some(b=>b.target==="immutable")],
  ["Offsite backup copy",S.backups.some(b=>b.target==="offsite")],["Restore tested",!!S.flags.restoreTested]];
 return{checks,score:Math.round(checks.filter(c=>c[1]).length/checks.length*100)}}
function critCovered(){const c=S.vms.filter(v=>CRIT_ROLES.includes(v.role));return c.length>0&&c.every(backedUp)}

 entra(){if(!S.ad.domain)return toast("Needs an AD domain to sync from.");S.ad.entra=!S.ad.entra;log(S.ad.entra?`Entra Connect sync enabled: ${S.ad.users.length} users, ${S.ad.groups.length} groups synced to Entra ID`:"Entra sync disabled",S.ad.entra?"ok":"warn")},

 addBackup(){if(!runningRole("Backup Server"))return toast("Create and power on a VM with the Backup Server role first.");
   form("New backup job",[{k:"n",label:"Job name",value:"Daily-Critical"},{k:"vms",label:"VMs to protect",tip:"backup",type:"checks",options:S.vms.map(v=>[v.id,`${v.name} (${v.role})`]),value:S.vms.filter(v=>CRIT_ROLES.includes(v.role)).map(v=>v.id)},
   {k:"target",label:"Target repository",type:"select",options:[["local","Local repository"],["immutable","Hardened immutable repository"],["offsite","Offsite / cloud object storage"]]},
   {k:"freq",label:"Frequency (RPO)",tip:"rpo",type:"select",options:["Every 4 hours","Daily","Weekly"]}],f=>{

function findTarget(v,src,live){const c=byId(S.clusters,src.clusterId);if(!c)return null;

 ${S.vms.length?`<div class="tw"><table><tr><th>VM</th><th>Role ${tip("role")}</th><th>Size</th><th>Host</th><th>${T("store")}</th><th>Network</th><th>State</th><th>${T("snap")}s</th><th>Actions</th></tr>
 ${S.vms.map(v=>{const h=byId(S.hosts,v.hostId),st=byId(S.storage,v.storageId),n=byId(S.vlans,v.vlanId);return`<tr><td><b>${esc(v.name)}</b><div style="font-size:11px;color:var(--mute)">${esc(v.os)}</div></td><td>${esc(v.role)}</td><td>${v.vcpu} vCPU · ${v.ram} GB · ${v.disk} GB</td>
 <td>${h?esc(h.name):"?"}</td><td>${st?esc(st.name):"?"}</td><td>${n?"VLAN "+n.vlan:"—"}</td><td>${statusPill(v.power)} ${backedUp(v)?'<span class="pill acc">backed up</span>':""}</td><td>${v.snaps.length}</td>
 <td><div class="row"><button class="sm" data-act="power" data-v="${v.id}">${v.power==="on"?"Shut down":"Power on"}</button><button class="sm" data-act="migrate" data-v="${v.id}" data-tip="mig">Migrate</button>
 <button class="sm" data-act="snap" data-v="${v.id}" data-tip="snap">${T("snap")}</button>${v.snaps.length?`<button class="sm" data-act="revert" data-v="${v.id}">Revert</button><button class="sm" data-act="delSnaps" data-v="${v.id}">Consolidate</button>`:""}<button class="sm" data-act="delVM" data-v="${v.id}">✕</button></div></td></tr>`}).join("")}</table></div>`:'<div class="empty">No VMs. You need at least one host and one storage location first.</div>'}</div>`}

function vNet(){return`<h2>Network ${tip("vlan")}</h2><p class="sub">Segmentation, switching, firewalling and core network services.</p><div class="grid g2">
 <div class="card"><div class="row" style="justify-content:space-between"><h3>VLANs & subnets ${tip("subnet")}</h3><button data-act="addVlan">+ Add VLAN</button></div>
 ${S.vlans.length?`<table><tr><th>ID</th><th>Name</th><th>Subnet</th><th>Site</th><th>VMs</th><th></th></tr>${S.vlans.map(v=>`<tr><td>${v.vlan}</td><td>${esc(v.name)}</td><td>${esc(v.subnet)}</td><td>${esc(v.site)}</td><td>${S.vms.filter(x=>x.vlanId===v.id).length}</td><td><button class="sm" data-act="delVlan" data-v="${v.id}">✕</button></td></tr>`).join("")}</table>`:'<div class="empty">No VLANs.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Virtual switches ${tip("vswitch")}</h3><button data-act="addSwitch">+ Add ${T("vsw")}</button></div>
 ${S.switches.map(s=>`<div class="ctl"><div><div class="nm">${esc(s.name)}</div><div class="ds">${esc(s.type)} · ${s.uplinks} uplink(s) · ${s.vlanIds.length} VLAN(s)</div></div><button class="sm" data-act="delSwitch" data-v="${s.id}">✕</button></div>`).join("")||'<div class="empty">No virtual switches.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Firewall rules ${tip("firewall")}</h3><div class="row"><button data-act="addFw">+ Rule</button><button data-act="addDefaultDeny" data-tip="defaultdeny">+ Default deny</button></div></div>
 <p class="ds" style="font-size:12px;color:var(--mute);margin:0 0 6px">Evaluated top to bottom; first match wins.</p>
 ${S.fw.length?`<div class="tw"><table><tr><th>#</th><th>Name</th><th>Src → Dst</th><th>Port</th><th>Action</th><th></th></tr>${S.fw.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.src)} → ${esc(r.dst)}</td><td>${esc(r.port)}</td><td><span class="pill ${r.action==="Allow"?"ok":"bad"}">${r.action}</span></td><td><div class="row"><button class="sm" data-act="fwUp" data-v="${r.id}">↑</button><button class="sm" data-act="fwDown" data-v="${r.id}">↓</button><button class="sm" data-act="delFw" data-v="${r.id}">✕</button></div></td></tr>`).join("")}</table></div>`:'<div class="empty">No rules.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>DHCP scopes ${tip("dhcp")}</h3><button data-act="addDhcp">+ Scope</button></div>
 ${S.dhcp.map(d=>{const v=byId(S.vlans,d.vlanId);return`<div class="ctl"><div><div class="nm">${v?esc(v.name)+" ("+esc(v.subnet)+")":"?"}</div><div class="ds">Range .${esc(d.range)} · ${d.lease}-day lease</div></div><button class="sm" data-act="delDhcp" data-v="${d.id}">✕</button></div>`}).join("")||'<div class="empty">No scopes.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>DNS ${tip("dns")} ${S.ad.domain?`<span class="pill">${esc(S.ad.domain)}</span>`:""}</h3><button data-act="addDns">+ Record</button></div>
 ${S.dns.length?`<table><tr><th>Name</th><th>Type</th><th>Value</th><th></th></tr>${S.dns.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.type}</td><td>${esc(r.value)}</td><td><button class="sm" data-act="delDns" data-v="${r.id}">✕</button></td></tr>`).join("")}</table>`:'<div class="empty">No DNS zone yet — it is created with your AD domain.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Site-to-site VPN ${tip("vpn")}</h3><button data-act="addVpn">+ Tunnel</button></div>
 ${S.vpn.map(t=>`<div class="ctl"><div><div class="nm">${esc(t.name)} <span class="pill ok">up</span></div><div class="ds">→ ${esc(t.peer)} · ${esc(t.type)} · ${esc(t.auth)}</div></div><button class="sm" data-act="delVpn" data-v="${t.id}">✕</button></div>`).join("")||'<div class="empty">No tunnels.</div>'}</div>
 </div>`}

function vId(){const ad=S.ad;if(!ad.domain)return`<h2>Identity ${tip("ad")}</h2><p class="sub">Active Directory and Microsoft Entra ID.</p><div class="card"><h3>No domain yet ${tip("dc")}</h3>
 <p>To build Active Directory you need a running VM with the <b>Domain Controller</b> role. ${dcOn()?'<span class="pill ok">DC VM ready</span>':'<span class="pill warn">no running DC VM</span>'}</p><button class="pri" data-act="createDomain">Create new forest / domain</button></div>`;
 return`<h2>Identity — ${esc(ad.domain)} ${tip("ad")}</h2><p class="sub">Domain controllers: ${S.vms.filter(v=>v.role.includes("Domain Controller")||v.role.includes("RODC")).map(v=>esc(v.name)+(v.power==="on"?"":" (off)")).join(", ")||"none!"}</p>
 <div class="grid g2">
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Users ${tip("user")}</h3><div class="row"><button data-act="addUser">+ User</button><button data-act="bulkUsers">Import 5 users</button></div></div>
 ${ad.users.length?`<div class="tw"><table><tr><th>User</th><th>OU</th><th>Groups</th><th></th></tr>${ad.users.map(u=>`<tr><td>${esc(u.n)} ${u.admin?'<span class="pill warn">admin</span>':""}</td><td>${esc(u.ou)}</td><td>${u.groups.map(esc).join(", ")||"—"}</td><td><button class="sm" data-act="delUser" data-v="${esc(u.n)}">✕</button></td></tr>`).join("")}</table></div>`:'<div class="empty">No users.</div>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>OUs & groups ${tip("ou")}</h3><div class="row"><button data-act="addOU">+ OU</button><button data-act="addGroup" data-tip="group">+ Group</button></div></div>
 <div style="margin-bottom:8px"><b style="font-size:12px;color:var(--mute)">OUs</b><br>${ad.ous.map(o=>`<span class="pill" style="margin:2px">OU=${esc(o)}</span>`).join("")}</div>
 <div><b style="font-size:12px;color:var(--mute)">Groups</b><br>${ad.groups.map(g=>`<span class="pill acc" style="margin:2px">${esc(g)}</span>`).join("")||'<span class="empty">none</span>'}</div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Group Policy ${tip("gpo")}</h3><button data-act="addGPO">+ GPO</button></div>
 ${ad.gpos.map(g=>`<div class="ctl"><div><div class="nm">${esc(g.n)}</div><div class="ds">${esc(g.setting)} → OU=${esc(g.ou)}</div></div><button class="sm" data-act="delGPO" data-v="${g.id}">✕</button></div>`).join("")||'<div class="empty">No GPOs.</div>'}
 <div class="ds" style="font-size:12px;color:var(--mute);margin-top:6px">Settings: baseline ${tip("baseline")} LAPS ${tip("laps")}</div></div>
 <div class="card"><h3>Hybrid identity ${tip("entra")}</h3><div class="ctl"><div><div class="nm">Microsoft Entra Connect sync</div><div class="ds">Sync users & groups to Entra ID for Microsoft 365</div></div><label class="sw"><input type="checkbox" ${ad.entra?"checked":""} data-act="entra"><span></span></label></div>
 <div class="ctl"><div><div class="nm">MFA ${tip("mfa")}</div><div class="ds">Managed on the Security page</div></div>${S.sec.mfa?'<span class="pill ok">enforced</span>':'<span class="pill bad">off</span>'}</div></div>
 </div>`}

function vSec(){const ctl=(k,n,d)=>`<div class="ctl"><div><div class="nm">${n} ${tip(k)}</div><div class="ds">${d}</div></div><label class="sw"><input type="checkbox" ${S.sec[k]?"checked":""} data-act="sec" data-v="${k}"><span></span></label></div>`;
 return`<h2>Security & Backup ${tip("posture")}</h2><p class="sub">Defensive controls and data protection. Posture score: <b>${posture().score}%</b></p><div class="grid g2">
 <div class="card"><h3>Security controls</h3>
 ${ctl("mfa","Multi-factor authentication","Conditional Access policy for all users")}
 ${ctl("edr","Endpoint Detection & Response","Agent on every VM and workstation")}
 ${ctl("patch","Patch management",S.platform==="vmware"?"vSphere Lifecycle Manager + Azure Update Manager":"Azure Update Manager / Intune / Cluster-Aware Updating")}
 ${ctl("siem","Central logging (SIEM)","Forward event, firewall and hypervisor logs")}
 ${ctl("pam","Privileged access management","Just-in-time admin elevation")}
 <div class="ds" style="font-size:12px;color:var(--mute);margin-top:8px">Baselines and LAPS are applied via Group Policy (Identity page). Default deny is on the Network page.</div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h3>Backup jobs ${tip("backup")}</h3><button class="pri" data-act="addBackup">+ Job</button></div>
 <div class="row" style="font-size:12px;color:var(--mute);margin-bottom:6px">Immutable ${tip("immutable")} Offsite ${tip("offsite")} Restore test ${tip("restore")} RPO/RTO ${tip("rpo")}</div>
 ${S.backups.map(b=>`<div class="ctl"><div><div class="nm">${esc(b.n)} <span class="pill ${b.target==="immutable"?"ok":b.target==="offsite"?"acc":""}">${b.target}</span></div><div class="ds">${b.vmIds.map(id=>esc((byId(S.vms,id)||{}).name)).join(", ")} · ${esc(b.freq)} · last run: ${esc(b.last)}</div></div>
 <div class="row"><button class="sm" data-act="runBackup" data-v="${b.id}">Run now</button><button class="sm" data-act="testRestore" data-v="${b.id}">Test restore</button><button class="sm" data-act="delBackup" data-v="${b.id}">✕</button></div></div>`).join("")||'<div class="empty">No jobs. Requires a running Backup Server VM.</div>'}
 <div style="margin-top:8px">Critical VMs protected: ${critCovered()?'<span class="pill ok">all</span>':'<span class="pill bad">gaps</span>'} ${S.flags.restoreTested?'<span class="pill ok">restore verified</span>':""}</div></div>
 </div>`}

function vScn(){const st=scnState();
 let cur="";if(st){const el=Math.round(((S.scenario.end||Date.now())-S.scenario.start)/60000);
  cur=`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3>${esc(st.s.title)} <span class="pill">${st.s.lvl}</span></h3><button class="sm dan" data-act="stopScn">Abandon</button></div>
  <p>${esc(st.s.desc)}</p>${bar(st.done/st.res.length*100)}<p style="font-size:12px;color:var(--mute)">${st.done}/${st.res.length} complete · ${el} min elapsed</p>
  ${st.s.obj.map((o,i)=>`<div class="obj ${st.res[i]?"done":""}"><div class="ck">${st.res[i]?"✓":""}</div><div><div>${esc(o[0])}</div><div class="hint">Hint: ${esc(o[2])}</div></div></div>`).join("")}
  ${st.done===st.res.length?`<p style="margin-top:12px"><span class="pill ok">Scenario complete in ${el} min</span> Pick another challenge below, or keep building on this environment.</p>`:""}</div>`}
 return`<h2>Build scenarios ${tip("scenario")}</h2><p class="sub">Real-world IT projects with live-checked objectives. Starting a scenario keeps your current lab — use Reset or the sample environment for a clean start.</p>${cur}
 <div class="grid g2">${SCN.map(s=>`<div class="card"><h3>${esc(s.title)} <span class="pill ${s.lvl==="Beginner"?"ok":s.lvl==="Advanced"?"bad":"warn"}">${s.lvl}</span></h3><p style="margin:0 0 8px">${esc(s.desc)}</p>
 <div style="font-size:12px;color:var(--mute);margin-bottom:10px">${s.obj.length} objectives</div><button class="${S.scenario&&S.scenario.id===s.id?"":"pri"}" data-act="startScn" data-v="${s.id}">${S.scenario&&S.scenario.id===s.id?"Restart":"Start"}</button></div>`).join("")}</div>`}

/* ===================== MODALS ===================== */
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function form(title,fields,onSubmit){
 const html=fields.map(f=>{const lab=`<label>${esc(f.label)} ${f.tip?tip(f.tip):""}</label>`;
  if(f.type==="select")return`<div class="field">${lab}<select name="${f.k}">${f.options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${f.value==v?"selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
  if(f.type==="checks")return`<div class="field">${lab}<div class="checks">${f.options.length?f.options.map(([v,l])=>`<label><input type="checkbox" name="${f.k}" value="${esc(v)}" ${(f.value||[]).includes(v)?"checked":""}>${esc(l)}</label>`).join(""):'<span class="empty">none available</span>'}</div></div>`;
  if(f.type==="checkbox")return`<div class="field"><label style="color:var(--text)"><input type="checkbox" name="${f.k}" style="width:auto" ${f.value?"checked":""}> ${esc(f.label)} ${f.tip?tip(f.tip):""}</label></div>`;
  return`<div class="field">${lab}<input name="${f.k}" type="${f.type||"text"}" value="${esc(f.value??"")}"></div>`}).join("");
 const root=document.getElementById("modalRoot");
 root.innerHTML=`<div class="modal-bg"><form class="modal"><h3>${esc(title)}</h3>${html}<div id="ferr" style="color:#ffa198;min-height:18px;font-size:13px"></div><div class="row" style="justify-content:flex-end"><button type="button" data-close>Cancel</button><button class="pri" type="submit">OK</button></div></form></div>`;
 const fm=root.querySelector("form");
 fm.querySelector("[data-close]").onclick=closeModal;
 fm.onsubmit=e=>{e.preventDefault();const out={};
  fields.forEach(f=>{if(f.type==="checks")out[f.k]=[...fm.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
   else if(f.type==="checkbox")out[f.k]=fm.querySelector(`input[name="${f.k}"]`).checked;
   else out[f.k]=fm.querySelector(`[name="${f.k}"]`).value.trim()});
  const err=onSubmit(out);if(err){fm.querySelector("#ferr").textContent=err;return}closeModal();commit()};
 const first=fm.querySelector("input,select");if(first&&window.innerWidth>760)first.focus()}
function confirmBox(msg,yes){const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modal-bg"><div class="modal"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button data-n>Cancel</button><button class="pri" data-y>Confirm</button></div></div></div>`;
 root.querySelector("[data-n]").onclick=closeModal;root.querySelector("[data-y]").onclick=()=>{closeModal();yes()}}
function toast(msg){log(msg,"warn");const root=document.getElementById("modalRoot");root.innerHTML=`<div class="modal-bg"><div class="modal"><h3 style="color:var(--warn)">Can't do that yet</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="pri" data-n>OK</button></div></div></div>`;
 root.querySelector("[data-n]").onclick=()=>{closeModal();render()};return"__toast"}

/* ===================== EVENTS ===================== */
function commit(){save();render()}
document.addEventListener("click",e=>{
 const ti=e.target.closest(".tip-ic");if(ti){e.preventDefault();e.stopPropagation();showTip(ti,true);return}
 const el=e.target.closest("[data-act]");if(!el)return;
 if(el.closest("label.sw")&&e.target.tagName!=="INPUT")return;
 const fn=A[el.dataset.act];if(!fn)return;
 const r=el.dataset.k?fn(el.dataset.v,el.dataset.k):fn(el.dataset.v);
 if(r!=="__toast")commit();else save()});
/* tooltip */
const tipEl=document.getElementById("tip");let pinned=false;
function showTip(el,pin){const g=G[el.dataset.tip];if(!g)return;pinned=!!pin;
 tipEl.innerHTML=`<h4>${esc(g.t)}</h4><p>${esc(g.d)}</p><div class="k">How to</div><p>${esc(g.h)}</p>${g.a?`<div class="k">Alternatives</div><p>${esc(g.a)}</p>`:""}${pin?'<p style="font-size:11px;color:var(--mute);margin-top:8px">Tap anywhere to close</p>':""}`;
 tipEl.style.display="block";const r=el.getBoundingClientRect(),tw=tipEl.offsetWidth,th=tipEl.offsetHeight;
 let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),innerWidth-tw-8),y=r.bottom+8;if(y+th>innerHeight-8)y=Math.max(8,r.top-th-8);
 tipEl.style.left=x+"px";tipEl.style.top=y+"px"}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned)showTip(el,false)});
document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-tip]");if(el&&!pinned&&!el.contains(e.relatedTarget))tipEl.style.display="none"});
document.addEventListener("pointerdown",e=>{if(pinned&&!e.target.closest(".tip-ic")&&!e.target.closest("#tip")){pinned=false;tipEl.style.display="none"}},true);
if(!S.log.length)log("Welcome. Load the sample environment or start from Datacenter → Add host. Hover (or tap) any ? for help.");
if(innerWidth<760)document.getElementById("log").classList.add("min");
render();
</script>
